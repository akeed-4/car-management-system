<div class="erp-page container">
  <div class="erp-page-header page-header">
    <div class="erp-page-header-titles header-content">
      <h1 class="erp-page-title">{{ 'APPROVALS.WORKFLOW_LIST_TITLE' | translate }}</h1>
      <p class="erp-page-subtitle subtitle">{{ 'APPROVALS.WORKFLOW_LIST_SUBTITLE' | translate }}</p>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" (click)="createWorkflow()">
        <mat-icon>add</mat-icon>
        {{ 'APPROVALS.CREATE_WORKFLOW' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: owns grid chrome/paging/actions; screen-specific cells
         (type chip, level badge, status chip) are provided generically via
         [cellTemplates]. The activate/deactivate buttons use the built-in
         per-row visibility support. -->
    <app-shared-data-grid
      [dataSource]="workflows()"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      [loading]="isLoading()"
      keyExpr="id"
      searchPlaceholder="COMMON.SEARCH"
      noDataText="APPROVALS.NO_WORKFLOWS"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">

      <!-- Document Type Template -->
      <ng-template #documentTypeTemplate let-cell>
        <mat-chip [color]="'accent'" selected>
          {{ getDocumentTypeLabel(cell.value) }}
        </mat-chip>
      </ng-template>

      <!-- Levels Template -->
      <ng-template #levelsTemplate let-cell>
        <span class="level-badge">
          <mat-icon>layers</mat-icon>
          {{ cell.data.approvalLevels?.length || 0 }}
        </span>
      </ng-template>

      <!-- Status Template -->
      <ng-template #statusTemplate let-cell>
        <mat-chip
          [color]="getStatusColor(cell.value)"
          selected>
          {{ cell.value ? ('APPROVALS.ACTIVE' | translate) : ('APPROVALS.INACTIVE' | translate) }}
        </mat-chip>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
