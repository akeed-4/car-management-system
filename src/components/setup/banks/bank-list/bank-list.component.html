<div class="page-container erp-page">
  <div class="page-header header-row erp-page-header">
    <div class="erp-page-header-titles">
      <h1 class="erp-page-title">{{ 'BANK.LIST_TITLE' | translate }}</h1>
    </div>
    <div class="erp-page-actions">
      <a routerLink="/entities/banks/new" mat-raised-button color="primary">
        <mat-icon>add</mat-icon>
        {{ 'BANK.CREATE_TITLE' | translate }}
      </a>
    </div>
  </div>

  <mat-toolbar class="page-toolbar erp-list-toolbar">
    <button mat-stroked-button (click)="refresh()">
      <mat-icon>refresh</mat-icon>
      {{ 'COMMON.REFRESH' | translate }}
    </button>

    <span class="toolbar-spacer erp-toolbar-spacer"></span>

    <button mat-icon-button [matMenuTriggerFor]="exportMenu" [matTooltip]="'COMMON.EXPORT' | translate">
      <mat-icon>file_download</mat-icon>
    </button>
    <mat-menu #exportMenu="matMenu">
      <button mat-menu-item (click)="exportExcel()">
        <mat-icon>description</mat-icon>
        {{ 'COMMON.EXPORT_EXCEL' | translate }}
      </button>
    </mat-menu>

    <button mat-icon-button (click)="printGrid()" [matTooltip]="'COMMON.PRINT' | translate">
      <mat-icon>print</mat-icon>
    </button>
  </mat-toolbar>

  <div class="grid-container erp-grid-card">
    <dx-data-grid
      [dataSource]="banks()"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [rowAlternationEnabled]="true"
      [rtlEnabled]="true"
      height="600px"
      [showRowLines]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [noDataText]="'BANK.NO_BANKS' | translate"
      keyExpr="id"
      rtlEnabled="true">

      <dxo-search-panel [visible]="true" [width]="240"></dxo-search-panel>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-column-chooser [enabled]="true" mode="select"></dxo-column-chooser>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]" [showInfo]="true"></dxo-pager>

      <dxi-column dataField="bankCode" [caption]="'BANK.BANK_CODE' | translate" [width]="120"></dxi-column>
      <dxi-column dataField="bankNameEnglish" [caption]="'BANK.NAME_ENGLISH' | translate"></dxi-column>
      <dxi-column dataField="bankNameArabic" [caption]="'BANK.NAME_ARABIC' | translate"></dxi-column>
      <dxi-column dataField="swiftCode" [caption]="'BANK.SWIFT_CODE' | translate" [width]="120"></dxi-column>
      <dxi-column dataField="country" [caption]="'BANK.COUNTRY' | translate" [width]="130"></dxi-column>
      <dxi-column dataField="currency" [caption]="'BANK.CURRENCY' | translate" [width]="100"></dxi-column>
      <dxi-column dataField="isActive" dataType="boolean" [caption]="'COMMON.ACTIVE' | translate" [width]="110" cellTemplate="statusTemplate"></dxi-column>

      <div *dxTemplate="let cell of 'statusTemplate'">
        <span class="status-badge erp-status-badge" [class.status-active]="cell.data.isActive" [class.status-inactive]="!cell.data.isActive"
              [ngClass]="cell.data.isActive ? 'success' : 'neutral'">
          {{ (cell.data.isActive ? 'COMMON.ACTIVE' : 'COMMON.INACTIVE') | translate }}
        </span>
      </div>

      <dxi-column type="buttons" [caption]="'COMMON.ACTIONS' | translate" [width]="150"  cellTemplate="actionsTemplate"></dxi-column>
      <div *dxTemplate="let cell of 'actionsTemplate'">
        <button mat-icon-button [matTooltip]="'COMMON.VIEW' | translate" (click)="onView({ row: { data: cell.data } })">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button [matTooltip]="'COMMON.EDIT' | translate" (click)="onEdit({ row: { data: cell.data } })">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" [matTooltip]="'COMMON.DELETE' | translate" (click)="onDelete({ row: { data: cell.data } })">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </dx-data-grid>
  </div>
</div>
