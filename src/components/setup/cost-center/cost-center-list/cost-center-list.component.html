<div class="cost-center-container">
  <!-- Header Section -->
  <div class="header-section">
    <div class="title-section">
      <h2>{{ 'COST_CENTER.LIST_TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'COST_CENTER.LIST_SUBTITLE' | translate }}</p>
    </div>
    <button
      mat-raised-button
      color="primary"
      class="add-button"
      (click)="onCreate()"
      appHasPermission="cost-center.create">
      <mat-icon>add</mat-icon>
      {{ 'COST_CENTER.ADD_NEW' | translate }}
    </button>
  </div>

  <!-- TreeList -->
  <div class="tree-section">
    <dx-tree-list
      id="costCentersTreeList"
      [dataSource]="costCentersWithLevels()"
      keyExpr="id"
      parentIdExpr="parentId"
      [showRowLines]="true"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="true"
      [rtlEnabled]="true"
      [autoExpandAll]="false"
      [hoverStateEnabled]="true"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true">

      <dxo-load-panel [enabled]="true"></dxo-load-panel>
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-search-panel
        [visible]="true"
        [placeholder]="'COST_CENTER.SEARCH_PLACEHOLDER' | translate">
      </dxo-search-panel>

      <!-- Level Column -->
      <dxi-column
        dataField="level"
        [caption]="translate.instant('COST_CENTER.LEVEL')"
        [width]="80"
        alignment="center"
        cellTemplate="levelTemplate">
      </dxi-column>

      <!-- Code Column -->
      <dxi-column
        dataField="code"
        [caption]="translate.instant('COST_CENTER.CODE')"
        [width]="120"
        cssClass="code-column">
      </dxi-column>

      <!-- Name Column -->
      <dxi-column
        dataField="name"
        [caption]="translate.instant('COST_CENTER.NAME')"
        cellTemplate="nameTemplate">
      </dxi-column>

      <!-- Name Arabic Column -->
      <dxi-column
        dataField="nameAr"
        [caption]="translate.instant('COST_CENTER.NAME_AR')">
      </dxi-column>

      <!-- Car Info Column -->
      <dxi-column
        dataField="carInfo"
        [caption]="translate.instant('COST_CENTER.CAR_INFO')"
        cellTemplate="carInfoTemplate">
      </dxi-column>

      <!-- Total Costs Column -->
      <dxi-column
        dataField="totalCosts"
        [caption]="translate.instant('COST_CENTER.TOTAL_COSTS')"
        dataType="number"
        [format]="{ type: 'currency', currency: 'SAR', precision: 2 }"
        alignment="right"
        [width]="150">
      </dxi-column>

      <!-- Status Column -->
      <dxi-column
        dataField="isActive"
        [caption]="translate.instant('COST_CENTER.STATUS')"
        cellTemplate="statusTemplate"
        [width]="120"
        alignment="center">
      </dxi-column>

      <!-- Created At Column -->
      <dxi-column
        dataField="createdAt"
        [caption]="translate.instant('COST_CENTER.CREATED_AT')"
        dataType="date"
        format="yyyy-MM-dd"
        [width]="120">
      </dxi-column>

      <!-- Actions Column -->
      <dxi-column
        type="buttons"
        [width]="150"
        [caption]="translate.instant('COST_CENTER.ACTIONS')">
        <dxi-button
          [hint]="translate.instant('COST_CENTER.ADD_CHILD')"
          icon="add"
          [onClick]="addChildClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('COST_CENTER.VIEW_ENTRIES')"
          icon="chart"
          [onClick]="viewEntriesClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('COST_CENTER.EDIT')"
          icon="edit"
          [onClick]="editClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('COST_CENTER.DELETE')"
          icon="trash"
          [onClick]="deleteClick">
        </dxi-button>
      </dxi-column>

      <!-- Level Column Template -->
      <div *dxTemplate="let data of 'levelTemplate'">
        <div class="level-cell">
          <span class="level-indicator" [style.margin-left.px]="(data.value - 1) * 20">
            <mat-icon class="level-icon">subdirectory_arrow_left</mat-icon>
            {{ data.value }}
          </span>
        </div>
      </div>

      <!-- Name Column Template -->
      <div *dxTemplate="let data of 'nameTemplate'">
        <div class="name-cell" [class.has-children]="hasChildren(data.data)">
          <span class="cost-center-name">{{ data.value }}</span>
        </div>
      </div>

      <!-- Car Info Column Template -->
      <div *dxTemplate="let data of 'carInfoTemplate'">
        <div class="car-info-cell" *ngIf="data.value">
          <mat-icon class="car-icon">directions_car</mat-icon>
          <span>{{ data.value }}</span>
        </div>
        <span *ngIf="!data.value" class="no-car">-</span>
      </div>

      <!-- Status Column Template -->
      <div *dxTemplate="let data of 'statusTemplate'">
        <mat-chip [color]="getStatusColor(data.value)" selected>
          {{ getStatusText(data.value) | translate }}
        </mat-chip>
      </div>
    </dx-tree-list>
  </div>
</div>
