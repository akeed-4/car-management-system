<mat-toolbar color="primary" class="toolbar">
  <mat-toolbar-row>
    <span>{{ pageTitle() | translate }}</span>
    <span class="spacer"></span>
    <a routerLink="/setup/car-category" mat-icon-button>
      <mat-icon>arrow_back</mat-icon>
    </a>
  </mat-toolbar-row>
</mat-toolbar>

<div class="container">
  <mat-card>
    <mat-card-content>
      <form [formGroup]="categoryForm" >
        <div class="form-grid">
          <mat-form-field appearance="outline">
            <mat-label>{{ 'CAR_CATEGORY.FORM.NAME' | translate }}</mat-label>
            <input matInput formControlName="name" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>{{ 'CAR_CATEGORY.FORM.NAME_AR' | translate }}</mat-label>
            <input matInput formControlName="nameAr">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>{{ 'CAR_CATEGORY.FORM.NAME_EN' | translate }}</mat-label>
            <input matInput formControlName="nameEn">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>{{ 'CAR_CATEGORY.FORM.DESCRIPTION' | translate }}</mat-label>
            <textarea matInput formControlName="description" rows="3"></textarea>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <a routerLink="/setup/car-category" mat-button>
            {{ 'CAR_CATEGORY.FORM.CANCEL' | translate }}
          </a>
          <button mat-raised-button color="primary" (click)="saveCategory()" [disabled]="categoryForm.invalid">
            {{ editMode() ? ('CAR_CATEGORY.FORM.SAVE_CHANGES' | translate) : ('CAR_CATEGORY.FORM.SAVE' | translate) }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
