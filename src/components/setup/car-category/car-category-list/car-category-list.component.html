<div class="container erp-page">
  <div class="page-header erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'CAR_CATEGORY.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      @if (canCreate()) {
      <a routerLink="/setup/car-categories/new" mat-raised-button color="primary">
        <mat-icon>add</mat-icon>
        {{ 'CAR_CATEGORY.ADD_NEW' | translate }}
      </a>
      }
    </div>
  </div>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="filteredCategoriesForMobile()"
      [fields]="mobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      [actions]="mobileActions"
      searchPlaceholder="CAR_CATEGORY.SEARCH_PLACEHOLDER"
      emptyMessage="CAR_CATEGORY.NO_CATEGORIES"
      (searchChange)="mobileSearch.set($event)"
      (action)="onMobileAction($event)">
    </shared-mobile-list>
  } @else {
    <app-shared-data-grid
      [dataSource]="categories()"
      [columns]="columns"
      [rowActions]="rowActions"
      keyExpr="id"
      searchPlaceholder="CAR_CATEGORY.SEARCH_PLACEHOLDER"
      noDataText="CAR_CATEGORY.NO_CATEGORIES"
      [pageSize]="10"
      [allowedPageSizes]="[10, 25, 50]"
      (rowAction)="onGridAction($event)">
    </app-shared-data-grid>
  }
</div>
