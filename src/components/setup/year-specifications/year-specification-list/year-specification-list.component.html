<div class="container erp-page">
  <div class="page-header erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'YEAR_SPECIFICATION.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      @if (canCreate()) {
      <a routerLink="/setup/year-specifications/new" mat-raised-button color="primary">
        <mat-icon>add</mat-icon>
        {{ 'YEAR_SPECIFICATION.ADD_NEW' | translate }}
      </a>
      }
    </div>
  </div>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="filteredSpecsForMobile()"
      [fields]="mobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      [actions]="mobileActions"
      searchPlaceholder="YEAR_SPECIFICATION.SEARCH_PLACEHOLDER"
      emptyMessage="YEAR_SPECIFICATION.NO_SPECS"
      (searchChange)="mobileSearch.set($event)"
      (action)="onMobileAction($event)">
    </shared-mobile-list>
  } @else {
    <app-shared-data-grid
      [dataSource]="specs()"
      [columns]="columns"
      [rowActions]="rowActions"
      keyExpr="id"
      searchPlaceholder="YEAR_SPECIFICATION.SEARCH_PLACEHOLDER"
      noDataText="YEAR_SPECIFICATION.NO_SPECS"
      [pageSize]="10"
      [allowedPageSizes]="[10, 25, 50]"
      (rowAction)="onGridAction($event)">
    </app-shared-data-grid>
  }
</div>
