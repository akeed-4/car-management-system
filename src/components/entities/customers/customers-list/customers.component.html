<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'CUSTOMERS.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
    <a routerLink="/entities/customers/new" class="btn btn-primary">
      <mat-icon>add</mat-icon>
      <span>{{ 'CUSTOMERS.ADD_NEW' | translate }}</span>
    </a>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: owns grid chrome, columns, row actions, paging
         (same fields/filters/page sizes as before). -->
    <app-shared-data-grid
      [dataSource]="filteredAndSortedCustomers()"
      [columns]="columns"
      [rowActions]="rowActions"
      keyExpr="id"
      height="500"
      scrollingMode="virtual"
      searchPlaceholder="COMMON.SEARCH"
      noDataText="COMMON.NO_DATA"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">
    </app-shared-data-grid>
  </div>
</div>

<app-modal
  [isOpen]="isDeleteModalOpen()"
  [title]="'CUSTOMERS.DELETE_MODAL.TITLE' | translate"
  [message]="'CUSTOMERS.DELETE_MODAL.MESSAGE' | translate"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()">
</app-modal>
