<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'SUPPLIERS.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
    <a routerLink="/entities/suppliers/new" class="btn btn-primary">
      <mat-icon>add</mat-icon>
      <!-- <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg> -->
      <span>{{ 'SUPPLIERS.ADD_NEW' | translate }}</span>
    </a>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: owns grid chrome, columns, row actions, paging
         (same fields/lookups/filters/page sizes as before). -->
    <app-shared-data-grid
      [dataSource]="filteredAndSortedSuppliers()"
      [columns]="columns"
      [rowActions]="rowActions"
      keyExpr="id"
      height="500"
      scrollingMode="virtual"
      searchPlaceholder="COMMON.SEARCH"
      noDataText="COMMON.NO_DATA"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">
    </app-shared-data-grid>
  </div>
</div>

<app-modal
  [isOpen]="isDeleteModalOpen()"
  [title]="'SUPPLIERS.DELETE_MODAL.TITLE' | translate"
  [message]="'SUPPLIERS.DELETE_MODAL.MESSAGE' | translate"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()">
</app-modal>
