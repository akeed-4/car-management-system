<div class="page-container">
  <div class="erp-card activation-card">
    <h1>{{ 'ONBOARDING.TENANT_ACTIVATION.TITLE' | translate }}</h1>

    <mat-progress-bar mode="indeterminate" *ngIf="loading()"></mat-progress-bar>

    <ng-container *ngIf="!loading()">
      <p class="reason">{{ reasonKey() | translate }}</p>
      <button mat-stroked-button (click)="logout()">
        {{ 'ONBOARDING.TENANT_ACTIVATION.LOGOUT' | translate }}
      </button>
    </ng-container>
  </div>
</div>
