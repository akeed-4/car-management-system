<div class="erp-page page-container">
  <div class="erp-page-header page-header">
    <div class="erp-page-header-titles">
      <span class="erp-page-eyebrow breadcrumb">
        {{ 'PLATFORM.BREADCRUMB' | translate }}
        <mat-icon>chevron_right</mat-icon>
        {{ 'PLATFORM.SUBSCRIPTIONS.TITLE' | translate }}
      </span>
      <h1 class="erp-page-title">{{ 'PLATFORM.SUBSCRIPTIONS.TITLE' | translate }}</h1>
    </div>
    <div class="erp-page-actions">
      <button mat-stroked-button (click)="refresh()">
        <mat-icon>refresh</mat-icon>
        {{ 'COMMON.REFRESH' | translate }}
      </button>
    </div>
  </div>

  <mat-progress-bar mode="indeterminate" *ngIf="loading()"></mat-progress-bar>

  <div class="erp-grid-card grid-container" *ngIf="!loading()">
    <!-- Shared DataGrid: owns grid chrome/paging/actions; the status/payment
         badges keep their exact colors via generic [cellTemplates]. -->
    <app-shared-data-grid
      [dataSource]="subscriptions()"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      keyExpr="id"
      searchPlaceholder="COMMON.SEARCH"
      noDataText="COMMON.NO_DATA"
      [pageSize]="20"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">

      <!-- Status badge (same colors/labels as before) -->
      <ng-template #statusTemplate let-cell>
        <span class="erp-status-badge chip" [style.background]="getStatusColor(cell.value) + '22'" [style.color]="getStatusColor(cell.value)">
          {{ getStatusLabel(cell.value) | translate }}
        </span>
      </ng-template>

      <!-- Payment-status badge (same colors/labels as before) -->
      <ng-template #paymentStatusTemplate let-cell>
        <span class="erp-status-badge chip" [style.background]="getPaymentStatusColor(cell.value) + '22'" [style.color]="getPaymentStatusColor(cell.value)">
          {{ getPaymentStatusLabel(cell.value) | translate }}
        </span>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
