<div class="erp-page page-container">
  <div class="erp-page-header page-header">
    <div class="erp-page-header-titles">
      <span class="erp-page-eyebrow breadcrumb">
        {{ 'PLATFORM.BREADCRUMB' | translate }}
        <mat-icon>chevron_right</mat-icon>
        {{ 'PLATFORM.DOMAINS.TITLE' | translate }}
      </span>
      <h1 class="erp-page-title">{{ 'PLATFORM.DOMAINS.TITLE' | translate }}</h1>
    </div>
    <div class="erp-page-actions">
      <button mat-stroked-button (click)="refresh()">
        <mat-icon>refresh</mat-icon>
        {{ 'COMMON.REFRESH' | translate }}
      </button>
    </div>
  </div>

  <mat-progress-bar mode="indeterminate" *ngIf="loading()"></mat-progress-bar>

  <div class="erp-grid-card grid-container" *ngIf="!loading()">
    <app-shared-data-grid
      [dataSource]="domains()"
      [columns]="columns"
      keyExpr="id"
      [pageSize]="20"
      [allowedPageSizes]="[10, 20, 50]">
    </app-shared-data-grid>
  </div>
</div>
