<div class="erp-page page-container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <span class="erp-page-eyebrow breadcrumb">
        {{ 'INVOICE.BACK_TO_SALES' | translate }}
        <mat-icon>chevron_right</mat-icon>
        {{ 'DIRECT_SALES.CASH.TITLE' | translate }}
      </span>
      <h1 class="erp-page-title">{{ 'DIRECT_SALES.CASH.TITLE' | translate }}</h1>
      <p class="erp-page-subtitle">{{ 'DIRECT_SALES.CASH.SUBTITLE' | translate }}</p>
    </div>
  </div>

  <mat-toolbar class="erp-list-toolbar page-toolbar">
    <button *ngIf="permissionService.hasPermission('sales.cash.view')" mat-flat-button color="primary" (click)="onCreateNew()">
      <mat-icon>add</mat-icon>
      {{ 'DIRECT_SALES.CASH.ADD_NEW' | translate }}
    </button>

    <button mat-stroked-button (click)="refresh()">
      <mat-icon>refresh</mat-icon>
      {{ 'COMMON.REFRESH' | translate }}
    </button>

    <span class="erp-toolbar-spacer toolbar-spacer"></span>

    <button mat-icon-button [matMenuTriggerFor]="exportMenu" [matTooltip]="'COMMON.EXPORT' | translate">
      <mat-icon>file_download</mat-icon>
    </button>
    <mat-menu #exportMenu="matMenu">
      <button mat-menu-item (click)="exportExcel()">
        <mat-icon>description</mat-icon>
        {{ 'COMMON.EXPORT_EXCEL' | translate }}
      </button>
      <button mat-menu-item (click)="exportPdf()">
        <mat-icon>picture_as_pdf</mat-icon>
        {{ 'COMMON.EXPORT_PDF' | translate }}
      </button>
    </mat-menu>

    <button mat-icon-button (click)="printGrid()" [matTooltip]="'COMMON.PRINT' | translate">
      <mat-icon>print</mat-icon>
    </button>
  </mat-toolbar>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="invoices()"
      [fields]="sharedMobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      [actions]="sharedMobileActions"
      [loading]="loading()"
      emptyMessage="DIRECT_SALES.CASH.NO_RECORDS"
      (action)="onSharedMobileAction($event)">
    </shared-mobile-list>
  } @else {
    <div class="erp-grid-card grid-container">
      <app-shared-data-grid
        [dataSource]="invoices()"
        [columns]="columns"
        [rowActions]="rowActions"
        [cellTemplates]="cellTemplates"
        [loading]="loading()"
        keyExpr="id"
        height="600px"
        noDataText="DIRECT_SALES.CASH.NO_RECORDS"
        [pageSize]="10"
        [allowedPageSizes]="[10, 20, 50]"
        (rowDblClick)="onGridRowDblClick($event)"
        (rowAction)="onGridAction($event)">

        <!-- Status badge (same classes/labels as before) -->
        <ng-template #statusTemplate let-cell>
          <span class="erp-status-badge" [ngClass]="{
            'success': cell.value === 'Paid',
            'warning': cell.value === 'Pending',
            'danger': cell.value === 'Overdue'
          }">
            {{ ('INVOICE.STATUS_' + cell.value?.toUpperCase()) | translate }}
          </span>
        </ng-template>
      </app-shared-data-grid>
    </div>
  }
</div>
