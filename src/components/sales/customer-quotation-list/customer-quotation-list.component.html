<div class="supplier-quotation-list">
  <h2>{{ 'CUSTOMER_QUOTATION_LIST.TITLE' | translate }}</h2>

  <dx-data-grid
    [dataSource]="quotations"
    [showBorders]="true"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    [columnAutoWidth]="true"
    [showColumnLines]="true"
    [showRowLines]="true"
    [rowAlternationEnabled]="true"
    [hoverStateEnabled]="true"
    [selection]="{ mode: 'single' }"
    keyExpr="id">

    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]" [showInfo]="true"></dxo-pager>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-search-panel [visible]="true" [placeholder]="'CUSTOMER_QUOTATION_LIST.SEARCH_PLACEHOLDER' | translate"></dxo-search-panel>

    <dxi-column dataField="quotationNumber" [caption]="'CUSTOMER_QUOTATION_LIST.QUOTATION_NUMBER' | translate"></dxi-column>
    <dxi-column dataField="linkedPurchaseRequestId" [caption]="'CUSTOMER_QUOTATION_LIST.LINKED_PURCHASE_REQUEST' | translate"></dxi-column>
    <dxi-column dataField="quotationDate" dataType="date" [caption]="'CUSTOMER_QUOTATION_LIST.QUOTATION_DATE' | translate"></dxi-column>
    <dxi-column dataField="validityPeriod" [caption]="'CUSTOMER_QUOTATION_LIST.VALIDITY_PERIOD' | translate"></dxi-column>
    <dxi-column dataField="currency" [caption]="'CUSTOMER_QUOTATION_LIST.CURRENCY' | translate"></dxi-column>
    <dxi-column dataField="status" [caption]="'CUSTOMER_QUOTATION_LIST.STATUS' | translate"></dxi-column>
    <dxi-column dataField="totalAmount" dataType="number" [caption]="'CUSTOMER_QUOTATION_LIST.TOTAL_AMOUNT' | translate" format="currency"></dxi-column>

    <dxi-column type="buttons" [caption]="'CUSTOMER_QUOTATION_LIST.ACTIONS' | translate">
      <dxi-button name="edit" [hint]="'CUSTOMER_QUOTATION_LIST.EDIT' | translate" (onClick)="onEdit($event.row.data)"></dxi-button>
      <dxi-button name="delete" [hint]="'CUSTOMER_QUOTATION_LIST.DELETE' | translate" (onClick)="onDelete($event.row.data)"></dxi-button>
      <dxi-button [hint]="'CUSTOMER_QUOTATION_LIST.VIEW' | translate" (onClick)="onView($event.row.data)">
        <i class="dx-icon-eye"></i>
      </dxi-button>
    </dxi-column>

  </dx-data-grid>
</div>
