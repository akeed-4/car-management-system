<mat-card class="bank-invoice-settlement">
  <mat-card-header>
    <mat-card-title>{{ 'BANK_FINANCING.INVOICE_SETTLEMENT' | translate }}</mat-card-title>
  </mat-card-header>

  <mat-card-content class="content">
    <div *ngIf="loading">{{ 'RETAIL.LOADING' | translate }}</div>
    <div *ngIf="!loading && !approvalId">{{ 'BANK_FINANCING.NO_APPROVAL_SELECTED' | translate }}</div>

    <app-split-billing-header [billing]="billing"></app-split-billing-header>

    <app-gov-registration-form (registrationChange)="onRegistrationChange($event)"></app-gov-registration-form>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" [disabled]="!isFormValid || submitting" (click)="onSubmit()">
      {{ 'BANK_FINANCING.FINALIZE_INVOICE' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
