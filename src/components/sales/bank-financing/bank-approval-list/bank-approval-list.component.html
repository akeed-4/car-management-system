<div class="erp-page container-fluid p-4">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'BANK_FINANCING.APPROVALS_LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'BANK_FINANCING.RECORD_APPROVAL' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <app-shared-data-grid
      [dataSource]="quotations()"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      keyExpr="id"
      height="600px"
      noDataText="BANK_FINANCING.NO_APPROVALS"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowDblClick)="onGridRowDblClick($event)"
      (rowAction)="onGridAction($event)">

      <!-- Status badge (same classes/labels as before) -->
      <ng-template #statusTemplate let-cell>
        <span class="erp-status-badge" [ngClass]="{
          'warning': cell.value === 'Locked',
          'success': cell.value === 'Bank_Approved' || cell.value === 'Finalized',
          'danger': cell.value === 'Expired' || cell.value === 'Cancelled'
        }">
          {{ ('BANK_FINANCING.STATUS_' + cell.value?.toUpperCase()) | translate }}
        </span>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
