<div class="erp-page container-fluid p-4">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'BANK_FINANCING.ORDERS_LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button *ngIf="permissionService.hasPermission('sales.bank.orders.view')" mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'BANK_FINANCING.NEW_ORDER_ACTION' | translate }}
      </button>
    </div>
  </div>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="orders()"
      [fields]="sharedMobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      [actions]="sharedMobileActions"
      emptyMessage="BANK_FINANCING.NO_ORDERS"
      (action)="onSharedMobileAction($event)">
    </shared-mobile-list>
  } @else {
    <div class="erp-grid-card">
      <app-shared-data-grid
        [dataSource]="orders()"
        [columns]="columns"
        [rowActions]="rowActions"
        keyExpr="id"
        height="600px"
        noDataText="BANK_FINANCING.NO_ORDERS"
        [pageSize]="10"
        [allowedPageSizes]="[10, 20, 50]"
        (rowDblClick)="onGridRowDblClick($event)"
        (rowAction)="onGridAction($event)">
      </app-shared-data-grid>
    </div>
  }
</div>
