<div class="container-fluid p-4">
  <div class="page-header strong-header header-row">
    <div class="header-left">
      <h2>{{ 'BANK_FINANCING.ORDERS_LIST_TITLE' | translate }}</h2>
    </div>
  </div>

  <dx-data-grid
    [dataSource]="orders()"
    [showBorders]="true"
    [columnAutoWidth]="true"
    [rowAlternationEnabled]="true"
    [rtlEnabled]="true"
    height="600px"
    [showRowLines]="true"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    [noDataText]="'BANK_FINANCING.NO_ORDERS' | translate"
    (onRowDblClick)="onView($event)"
    keyExpr="id">

    <dxo-search-panel [visible]="true"></dxo-search-panel>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

    <dxi-column dataField="quotationNumber" [caption]="'CORPORATE.QUOTATION_NUMBER' | translate"></dxi-column>
    <dxi-column dataField="endUserName" [caption]="'BANK_FINANCING.END_USER_NAME' | translate"></dxi-column>
    <dxi-column dataField="bankName" [caption]="'BANK_FINANCING.BANK' | translate"></dxi-column>
    <dxi-column dataField="vin" caption="VIN"></dxi-column>
    <dxi-column dataField="approvedFinancingAmount" [caption]="'BANK_FINANCING.APPROVED_FINANCING_AMOUNT' | translate" dataType="number" format="currency"></dxi-column>

    <dxi-column type="buttons" [width]="80">
      <dxi-button
        icon="find"
        [hint]="'COMMON.VIEW' | translate"
        [onClick]="onView">
      </dxi-button>
    </dxi-column>
  </dx-data-grid>
</div>
