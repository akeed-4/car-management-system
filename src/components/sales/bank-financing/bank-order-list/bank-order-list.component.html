<div class="erp-page container-fluid p-4">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'BANK_FINANCING.ORDERS_LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'BANK_FINANCING.NEW_ORDER_ACTION' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: on mobile (<=840px) this renders the same rows as
         full-width cards (mobileFields/mobileTitleOf/mobileTrackBy), same
         single view action, instead of the grid's clipped 8 columns. -->
    <app-shared-data-grid
      [dataSource]="orders()"
      [columns]="columns"
      [rowActions]="rowActions"
      [mobileItems]="orders()"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      keyExpr="id"
      height="600px"
      noDataText="BANK_FINANCING.NO_ORDERS"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowDblClick)="onGridRowDblClick($event)"
      (rowAction)="onGridAction($event)">

      <ng-template let-item>
        <button type="button" class="btn btn-light" (click)="mobileView(item)">{{ 'COMMON.VIEW' | translate }}</button>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
