<div class="erp-page container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ getCaption('TITLE') }}</h2>
    </div>
    <div class="erp-page-actions">
      <button *ngIf="permissionService.hasPermission('sales.credit.view')" (click)="navigateToNewCreditInvoice()" class="btn btn-primary btn-small no-print">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        </svg>
        <span>{{ 'SALES.NEW_INVOICE' | translate }}</span>
      </button>
    </div>
  </div>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="creditInvoices()"
      [fields]="sharedMobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      [actions]="sharedMobileActions"
      searchPlaceholder="COMMON.SEARCH"
      [emptyMessage]="getCaption('NO_DATA')"
      (action)="onSharedMobileAction($event)">
    </shared-mobile-list>
  } @else {
    <div class="erp-grid-card card">
      <div class="table-wrapper premium-table">
        <app-shared-data-grid
          [dataSource]="creditInvoices()"
          [columns]="columns"
          [rowActions]="rowActions"
          keyExpr="id"
          [height]="600"
          [showSearchPanel]="false"
          [showColumnChooser]="false"
          selectionMode="single"
          [noDataText]="getCaption('NO_DATA')"
          [pageSize]="10"
          [allowedPageSizes]="[5, 10, 20]"
          (rowAction)="onGridAction($event)">
        </app-shared-data-grid>
      </div>
    </div>
  }
</div>
