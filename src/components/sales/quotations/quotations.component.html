<div class="erp-page quotations-container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'QUOTATIONS.TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" (click)="addNewQuotation()">
        <mat-icon>add</mat-icon>
        {{ 'QUOTATIONS.ADD_NEW' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: owns grid chrome/paging (same fields/page sizes). -->
    <app-shared-data-grid
      class="quotations-grid"
      [dataSource]="quotations"
      [columns]="columns"
      keyExpr="id"
      [showSearchPanel]="false"
      [showFilterRow]="false"
      [showHeaderFilter]="false"
      [showColumnChooser]="false"
      noDataText="COMMON.NO_DATA"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]">
    </app-shared-data-grid>
  </div>
</div>
