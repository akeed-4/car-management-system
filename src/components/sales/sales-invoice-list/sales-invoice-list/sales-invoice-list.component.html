<div class="erp-page container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ customTitle ? (customTitle | translate) : ('SALES.LIST_TITLE' | translate) }}</h2>
    </div>
    <div class="erp-page-actions">
      <a [routerLink]="isCashInvoice ? '/sales/invoice/cash/new' : '/sales/invoice/credit/new'" class="btn btn-primary btn-small no-print">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        </svg>
        <span>{{ 'SALES.NEW_INVOICE' | translate }}</span>
      </a>
    </div>
  </div>

  @if (isMobile()) {
    <app-mobile-card-list
      [items]="invoices()"
      [fields]="mobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      emptyMessage="SALES.NO_INVOICES"
    >
      <ng-template let-item>
        <button type="button" class="btn btn-light" (click)="mobilePrintClick(item)">{{ 'SALES.PRINT_INVOICE' | translate }}</button>
        <button type="button" class="btn btn-light" (click)="mobileEditClick(item)">{{ 'SALES.EDIT_INVOICE' | translate }}</button>
      </ng-template>
    </app-mobile-card-list>
  } @else {
  <div class="erp-grid-card datagrid-container">
    <dx-data-grid
      [dataSource]="dataSource"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      height="600px">

      <dxo-paging [pageSize]="10" [enabled]="true"></dxo-paging>
      <dxo-pager [visible]="true" [allowedPageSizes]="[5, 10, 20]" [displayMode]="'full'"
        [showPageSizeSelector]="true" [showInfo]="true" [showNavigationButtons]="true">
      </dxo-pager>
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-search-panel [visible]="true"
        [placeholder]="'SALES.SEARCH_PLACEHOLDER' | translate"></dxo-search-panel>

      <dxi-column dataField="invoiceNumber" [caption]="'SALES.COL_INVOICE_NUMBER' | translate"
        [width]="150" alignment="right">
      </dxi-column>

      <dxi-column dataField="invoiceDate" [caption]="'SALES.COL_DATE' | translate" dataType="date"
        format="yyyy-MM-dd" [width]="120" alignment="right">
      </dxi-column>

      <dxi-column dataField="customerName" [caption]="'SALES.COL_CUSTOMER' | translate" [minWidth]="200"
        alignment="right">
      </dxi-column>

      <dxi-column dataField="totalAmount" [caption]="'SALES.COL_TOTAL' | translate" dataType="number"
        format="currency" [width]="130" alignment="right">
        <dxo-format type="currency" currency="SAR"></dxo-format>
      </dxi-column>

      <dxi-column dataField="paymentStatus" [caption]="'SALES.COL_STATUS' | translate" [width]="120" alignment="right">
      </dxi-column>
   <dxi-column type="buttons" caption="{{ 'PURCHASES.ACTIONS' | translate }}" [width]="200" cssClass="no-print">
          <dxi-button
            icon="print"
            hint="{{ 'PURCHASES.PRINT_INVOICE' | translate }}"
            [onClick]="onPrintClick">
          </dxi-button>
          <dxi-button
            icon="edit"
            hint="{{ 'PURCHASES.EDIT_INVOICE' | translate }}"
            [onClick]="onEditClick">
          </dxi-button>
   </dxi-column>
      <dxo-summary>
        <dxi-total-item column="totalAmount" summaryType="sum" [customizeText]="customizeTotalText">
        </dxi-total-item>
        <dxi-total-item column="invoiceNumber" summaryType="count" [customizeText]="customizeCountText">
        </dxi-total-item>
      </dxo-summary>

    </dx-data-grid>
  </div>
  }
</div>
