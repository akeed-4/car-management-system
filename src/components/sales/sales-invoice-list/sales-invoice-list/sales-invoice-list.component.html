<div class="erp-page container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ customTitle ? (customTitle | translate) : ('SALES.LIST_TITLE' | translate) }}</h2>
    </div>
    <div class="erp-page-actions">
      <a *ngIf="permissionService.hasPermission(isCashInvoice ? 'sales.cash.view' : 'sales.credit.view')" [routerLink]="isCashInvoice ? '/sales/invoice/cash/new' : '/sales/invoice/credit/new'" class="btn btn-primary btn-small no-print">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        </svg>
        <span>{{ 'SALES.NEW_INVOICE' | translate }}</span>
      </a>
    </div>
  </div>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="invoices()"
      [fields]="sharedMobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="sharedMobileTrackBy"
      [actions]="sharedMobileActions"
      searchPlaceholder="SALES.SEARCH_PLACEHOLDER"
      emptyMessage="SALES.NO_INVOICES"
      (action)="onSharedMobileAction($event)">
    </shared-mobile-list>
  } @else {
    <div class="erp-grid-card datagrid-container">
      <!-- Shared DataGrid: owns the desktop grid chrome. Note it keeps binding the raw
           [dataSource] input (same as before -- it does NOT use the locally-filtered
           invoices() the mobile list above uses), preserving the original asymmetry
           between desktop/mobile data. -->
      <app-shared-data-grid
        [dataSource]="dataSource"
        [columns]="columns"
        [rowActions]="rowActions"
        [summaryItems]="summaryItems"
        height="600px"
        scrollingMode="virtual"
        searchPlaceholder="SALES.SEARCH_PLACEHOLDER"
        noDataText="SALES.NO_INVOICES"
        [pageSize]="10"
        [allowedPageSizes]="[5, 10, 20]"
        (rowAction)="onGridAction($event)">
      </app-shared-data-grid>
    </div>
  }
</div>
