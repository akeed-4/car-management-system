<div class="erp-page container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ customTitle ? (customTitle | translate) : ('SALES.LIST_TITLE' | translate) }}</h2>
    </div>
    <div class="erp-page-actions">
      <a [routerLink]="isCashInvoice ? '/sales/invoice/cash/new' : '/sales/invoice/credit/new'" class="btn btn-primary btn-small no-print">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        </svg>
        <span>{{ 'SALES.NEW_INVOICE' | translate }}</span>
      </a>
    </div>
  </div>

  <div class="erp-grid-card datagrid-container">
    <!-- Shared DataGrid: owns the desktop/mobile split internally. Note the desktop grid
         keeps binding the raw [dataSource] input (same as before -- it does NOT use the
         locally-filtered invoices() the mobile card list uses), preserving the original
         asymmetry between desktop/mobile data. -->
    <app-shared-data-grid
      [dataSource]="dataSource"
      [columns]="columns"
      [rowActions]="rowActions"
      [summaryItems]="summaryItems"
      [mobileItems]="invoices()"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      height="600px"
      scrollingMode="virtual"
      searchPlaceholder="SALES.SEARCH_PLACEHOLDER"
      noDataText="SALES.NO_INVOICES"
      [pageSize]="10"
      [allowedPageSizes]="[5, 10, 20]"
      (rowAction)="onGridAction($event)">
      <ng-template let-item>
        <button type="button" class="btn btn-light" (click)="mobilePrintClick(item)">{{ 'SALES.PRINT_INVOICE' | translate }}</button>
        <button type="button" class="btn btn-light" (click)="mobileEditClick(item)">{{ 'SALES.EDIT_INVOICE' | translate }}</button>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
