<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'CORPORATE.DELIVERIES_LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'CORPORATE.DISPATCH_VEHICLES' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: owns grid chrome + the mobile card rendering (same
         fields/actions the split @if(isMobile()) block used to duplicate). -->
    <app-shared-data-grid
      [dataSource]="deliveryNotes()"
      [columns]="columns"
      [rowActions]="rowActions"
      [loading]="loading()"
      [mobileItems]="deliveryNotes()"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      keyExpr="id"
      height="600px"
      noDataText="CORPORATE.NO_DELIVERIES"
      [showColumnChooser]="false"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowDblClick)="onView($event)"
      (rowAction)="onGridAction($event)">

      <ng-template let-note>
        <button type="button" class="btn btn-light" (click)="mobileView(note)">{{ 'COMMON.VIEW' | translate }}</button>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
