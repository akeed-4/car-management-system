<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'CORPORATE.DELIVERIES_LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button *ngIf="permissionService.hasPermission('sales.corporate.deliveries.view')" mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'CORPORATE.DISPATCH_VEHICLES' | translate }}
      </button>
    </div>
  </div>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="deliveryNotes()"
      [fields]="sharedMobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      [actions]="sharedMobileActions"
      [loading]="loading()"
      emptyMessage="CORPORATE.NO_DELIVERIES"
      (action)="onSharedMobileAction($event)">
    </shared-mobile-list>
  } @else {
    <div class="erp-grid-card">
      <app-shared-data-grid
        [dataSource]="deliveryNotes()"
        [columns]="columns"
        [rowActions]="rowActions"
        [loading]="loading()"
        keyExpr="id"
        height="600px"
        noDataText="CORPORATE.NO_DELIVERIES"
        [showColumnChooser]="false"
        [pageSize]="10"
        [allowedPageSizes]="[10, 20, 50]"
        (rowDblClick)="onView($event)"
        (rowAction)="onGridAction($event)">
      </app-shared-data-grid>
    </div>
  }
</div>
