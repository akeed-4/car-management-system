<div class="vin-batch-selector">
  <table mat-table [dataSource]="candidates" class="mat-elevation-z1">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox [checked]="isSelected(row.carId)" (change)="toggle(row.carId)"></mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="vin">
      <th mat-header-cell *matHeaderCellDef>{{ 'RETAIL.VIN' | translate }}</th>
      <td mat-cell *matCellDef="let row">{{ row.vin }}</td>
    </ng-container>

    <ng-container matColumnDef="vehicle">
      <th mat-header-cell *matHeaderCellDef>{{ 'CORPORATE.VEHICLE' | translate }}</th>
      <td mat-cell *matCellDef="let row">{{ row.make }} {{ row.model }} ({{ row.year }})</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="toggle(row.carId)"></tr>
  </table>

  <div *ngIf="candidates.length === 0" class="empty-state">
    {{ 'CORPORATE.NO_REMAINING_VINS' | translate }}
  </div>
</div>
