<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'CORPORATE.ORDERS_LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'CORPORATE.CREATE_ORDER' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
  <dx-data-grid
    [dataSource]="orders()"
    [showBorders]="true"
    [columnAutoWidth]="true"
    [rowAlternationEnabled]="true"
    [rtlEnabled]="true"
    height="600px"
    [showRowLines]="true"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    [noDataText]="'CORPORATE.NO_ORDERS' | translate"
    (onRowDblClick)="onView($event)"
    keyExpr="id">

    <dxo-search-panel [visible]="true"></dxo-search-panel>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

    <dxi-column dataField="id" [caption]="'CORPORATE.ORDER_NUMBER' | translate" [width]="90"></dxi-column>
    <dxi-column dataField="customerName" [caption]="'CORPORATE.CUSTOMER' | translate"></dxi-column>
    <dxi-column dataField="customerPoReference" [caption]="'CORPORATE.PO_REFERENCE' | translate"></dxi-column>
    <dxi-column dataField="orderDate" [caption]="'CORPORATE.ORDER_DATE' | translate" dataType="date"></dxi-column>
    <dxi-column dataField="totalAmount" [caption]="'INVOICE.TOTAL' | translate" dataType="number" format="currency"></dxi-column>
    <dxi-column dataField="status" [caption]="'CORPORATE.ORDER_STATUS' | translate" cellTemplate="statusCellTemplate"></dxi-column>
    <div *dxTemplate="let cell of 'statusCellTemplate'">
      <span class="erp-status-badge" [ngClass]="{
        'neutral': cell.value === 'New',
        'warning': cell.value === 'DepositPaid' || cell.value === 'Processing',
        'success': cell.value === 'Completed'
      }">
        {{ ('CORPORATE.ORDER_STATUS_' + cell.value?.toUpperCase()) | translate }}
      </span>
    </div>

    <dxi-column type="buttons" [width]="80">
      <dxi-button
        icon="find"
        [hint]="'COMMON.VIEW' | translate"
        [onClick]="onView">
      </dxi-button>
    </dxi-column>
  </dx-data-grid>
  </div>
</div>
