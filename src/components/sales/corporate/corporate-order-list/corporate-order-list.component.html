<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'CORPORATE.ORDERS_LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button *ngIf="permissionService.hasPermission('sales.corporate.orders.view')" mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'CORPORATE.CREATE_ORDER' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <app-shared-data-grid
      [dataSource]="orders()"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      [loading]="loading()"
      keyExpr="id"
      height="600px"
      noDataText="CORPORATE.NO_ORDERS"
      [showColumnChooser]="false"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowDblClick)="onView($event)"
      (rowAction)="onGridAction($event)">

      <!-- Status badge (same classes/labels as before) -->
      <ng-template #statusTemplate let-cell>
        <span class="erp-status-badge" [ngClass]="{
          'neutral': cell.value === 'New',
          'warning': cell.value === 'DepositPaid' || cell.value === 'Processing',
          'success': cell.value === 'Completed'
        }">
          {{ ('CORPORATE.ORDER_STATUS_' + cell.value?.toUpperCase()) | translate }}
        </span>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
