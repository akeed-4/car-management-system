<div class="erp-page page-container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <span class="erp-page-eyebrow breadcrumb">
        {{ 'INVOICE.BACK_TO_SALES' | translate }}
        <mat-icon>chevron_right</mat-icon>
        {{ 'CORPORATE.QUOTATIONS_LIST_TITLE' | translate }}
      </span>
      <h1 class="erp-page-title">{{ 'CORPORATE.QUOTATIONS_LIST_TITLE' | translate }}</h1>
      <p class="erp-page-subtitle">{{ 'CORPORATE.QUOTATIONS_LIST_SUBTITLE' | translate }}</p>
    </div>
  </div>

  <mat-toolbar class="erp-list-toolbar page-toolbar">
    <button mat-flat-button color="primary" (click)="onCreateNew()">
      <mat-icon>add</mat-icon>
      {{ 'CORPORATE.CREATE_QUOTATION' | translate }}
    </button>

    <button mat-stroked-button (click)="refresh()">
      <mat-icon>refresh</mat-icon>
      {{ 'COMMON.REFRESH' | translate }}
    </button>

    <span class="erp-toolbar-spacer toolbar-spacer"></span>

    <button mat-icon-button [matMenuTriggerFor]="exportMenu" [matTooltip]="'COMMON.EXPORT' | translate">
      <mat-icon>file_download</mat-icon>
    </button>
    <mat-menu #exportMenu="matMenu">
      <button mat-menu-item (click)="exportExcel()">
        <mat-icon>description</mat-icon>
        {{ 'COMMON.EXPORT_EXCEL' | translate }}
      </button>
      <button mat-menu-item (click)="exportPdf()">
        <mat-icon>picture_as_pdf</mat-icon>
        {{ 'COMMON.EXPORT_PDF' | translate }}
      </button>
    </mat-menu>

    <button mat-icon-button (click)="printGrid()" [matTooltip]="'COMMON.PRINT' | translate">
      <mat-icon>print</mat-icon>
    </button>
  </mat-toolbar>

  <div class="erp-grid-card grid-container">
    <dx-data-grid
      [dataSource]="quotations()"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [rowAlternationEnabled]="true"
      [rtlEnabled]="true"
      height="600px"
      [showRowLines]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [noDataText]="'CORPORATE.NO_QUOTATIONS' | translate"
      keyExpr="id">

      <dxo-search-panel [visible]="true"></dxo-search-panel>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

      <dxi-column dataField="quotationNumber" [caption]="'CORPORATE.QUOTATION_NUMBER' | translate" [width]="140"></dxi-column>
      <dxi-column dataField="customerName" [caption]="'CORPORATE.CUSTOMER' | translate"></dxi-column>
      <dxi-column dataField="quotationDate" [caption]="'CORPORATE.QUOTATION_DATE' | translate" dataType="date"></dxi-column>
      <dxi-column dataField="expiryDate" [caption]="'CORPORATE.EXPIRY_DATE' | translate" dataType="date"></dxi-column>
      <dxi-column dataField="totalAmount" [caption]="'INVOICE.TOTAL' | translate" dataType="number" format="currency"></dxi-column>
      <dxi-column dataField="status" [caption]="'CORPORATE.QUOTATION_STATUS' | translate" cellTemplate="statusCellTemplate"></dxi-column>
      <div *dxTemplate="let cell of 'statusCellTemplate'">
        <span class="erp-status-badge" [ngClass]="{
          'neutral': cell.value === 'Draft',
          'warning': cell.value === 'Approved',
          'success': cell.value === 'Converted',
          'danger': cell.value === 'Rejected' || cell.value === 'Expired'
        }">
          {{ ('CORPORATE.QUOTATION_STATUS_' + cell.value?.toUpperCase()) | translate }}
        </span>
      </div>

      <dxi-column type="buttons" [width]="140" [caption]="'CORPORATE.ACTIONS' | translate">
        <dxi-button
          icon="add"
          [hint]="'CORPORATE.CREATE_ORDER' | translate"
          [onClick]="onCreateOrder"
          [visible]="isApproved">
        </dxi-button>
      </dxi-column>
    </dx-data-grid>
  </div>
</div>
