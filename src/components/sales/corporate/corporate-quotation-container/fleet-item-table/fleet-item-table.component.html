<div class="fleet-item-table">
  <table mat-table [dataSource]="items" class="mat-elevation-z1">
    <ng-container matColumnDef="carModelDescription">
      <th mat-header-cell *matHeaderCellDef>{{ 'CORPORATE.CAR_MODEL' | translate }}</th>
      <td mat-cell *matCellDef="let row">
        <input matInput [(ngModel)]="row.carModelDescription" (ngModelChange)="onRowChange(items.indexOf(row))" />
      </td>
    </ng-container>

    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>{{ 'CORPORATE.QUANTITY' | translate }}</th>
      <td mat-cell *matCellDef="let row">
        <input matInput type="number" min="1" [(ngModel)]="row.quantity" (ngModelChange)="onRowChange(items.indexOf(row))" />
      </td>
    </ng-container>

    <ng-container matColumnDef="unitPrice">
      <th mat-header-cell *matHeaderCellDef>{{ 'CORPORATE.UNIT_PRICE' | translate }}</th>
      <td mat-cell *matCellDef="let row">
        <input matInput type="number" min="0" [(ngModel)]="row.unitPrice" (ngModelChange)="onRowChange(items.indexOf(row))" />
      </td>
    </ng-container>

    <ng-container matColumnDef="discountRate">
      <th mat-header-cell *matHeaderCellDef>{{ 'CORPORATE.DISCOUNT_RATE' | translate }}</th>
      <td mat-cell *matCellDef="let row">
        <input matInput type="number" min="0" max="100" [(ngModel)]="row.discountRate" (ngModelChange)="onRowChange(items.indexOf(row))" />
      </td>
    </ng-container>

    <ng-container matColumnDef="lineTotal">
      <th mat-header-cell *matHeaderCellDef>{{ 'CORPORATE.LINE_TOTAL' | translate }}</th>
      <td mat-cell *matCellDef="let row">{{ row.lineTotal | number:'1.2-2' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="warn" (click)="removeRow(items.indexOf(row))" type="button">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <button mat-stroked-button color="primary" (click)="addRow()" type="button" class="add-row-btn">
    <mat-icon>add</mat-icon>
    {{ 'CORPORATE.ADD_CAR_MODEL' | translate }}
  </button>

  <div *ngIf="items.length === 0" class="empty-state">
    {{ 'CORPORATE.NO_ITEMS_ADDED' | translate }}
  </div>
</div>
