<div class="container-fluid p-4">
  <div class="page-header strong-header header-row">
    <div class="header-left">
      <h2>{{ 'RETAIL_SALES_ORDER.APPROVAL_LIST_TITLE' | translate }}</h2>
    </div>
  </div>

  <dx-data-grid
    [dataSource]="orders"
    [showBorders]="true"
    [columnAutoWidth]="true"
    [rowAlternationEnabled]="true"
    [rtlEnabled]="true"
    height="600px"
    [showRowLines]="true"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    keyExpr="id">

    <dxo-search-panel [visible]="true"></dxo-search-panel>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

    <dxi-column dataField="orderNumber" [caption]="'RETAIL_SALES_ORDER.ORDER_NUMBER' | translate"></dxi-column>
    <dxi-column dataField="orderDate" [caption]="'RETAIL_SALES_ORDER.ORDER_DATE' | translate" dataType="date"></dxi-column>
    <dxi-column dataField="customerName" [caption]="'RETAIL_SALES_ORDER.CUSTOMER_NAME' | translate"></dxi-column>
    <dxi-column dataField="lines" [caption]="'RETAIL_SALES_ORDER.SEC_ITEMS' | translate" [calculateCellValue]="getLinesCount"></dxi-column>
    <dxi-column dataField="totalAmount" [caption]="'RETAIL_SALES_ORDER.TOTAL_AMOUNT' | translate" dataType="number"></dxi-column>
    <dxi-column dataField="status" [caption]="'RETAIL_SALES_ORDER.STATUS' | translate" cellTemplate="statusCellTemplate"></dxi-column>
    <div *dxTemplate="let cell of 'statusCellTemplate'">
      <span class="status-badge status-pending">
        {{ ('RETAIL_SALES_ORDER.STATUS_' + cell.value?.toUpperCase()) | translate }}
      </span>
    </div>

    <dxi-column type="buttons" [width]="150">
      <dxi-button
        icon="find"
        [hint]="'COMMON.VIEW' | translate"
        [onClick]="onView.bind(this)">
      </dxi-button>
      <dxi-button
        icon="check"
        [hint]="'RETAIL_SALES_ORDER.APPROVE' | translate"
        [onClick]="onApprove.bind(this)">
      </dxi-button>
      <dxi-button
        icon="close"
        [hint]="'RETAIL_SALES_ORDER.REJECT' | translate"
        [onClick]="onReject.bind(this)">
      </dxi-button>
    </dxi-column>
  </dx-data-grid>
</div>
