<mat-card class="retail-delivery-container">
  <mat-card-header>
    <mat-card-title>{{ 'RETAIL.DELIVERY_HANDOVER' | translate }}</mat-card-title>
  </mat-card-header>

  <mat-card-content class="content">
    <div *ngIf="loading">{{ 'RETAIL.LOADING' | translate }}</div>
    <div *ngIf="!loading && !invoiceId">{{ 'RETAIL.NO_INVOICE_SELECTED' | translate }}</div>

    <app-vehicle-specs-display [specs]="vehicleSpecs"></app-vehicle-specs-display>

    <app-gate-pass-checklist (checklistChange)="onChecklistChange($event)"></app-gate-pass-checklist>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" [disabled]="!isFormValid || submitting" (click)="onSubmit()">
      {{ 'RETAIL.CONFIRM_DELIVERY' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
