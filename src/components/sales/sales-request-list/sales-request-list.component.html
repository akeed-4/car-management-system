<div class="erp-page container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'SALES_REQUEST.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" (click)="createNewRequest()">
        <mat-icon>add</mat-icon>
        {{ 'SALES_REQUEST.CREATE_NEW' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card table-container">
    <!-- Shared DataGrid: owns grid chrome/selection/row actions (same
         view/edit/delete buttons and page sizes). -->
    <app-shared-data-grid
      [dataSource]="dataSource"
      [columns]="columns"
      [rowActions]="rowActions"
      keyExpr="id"
      height="500"
      [selectionMode]="'single'"
      [showSearchPanel]="false"
      noDataText="COMMON.NO_DATA"
      [pageSize]="10"
      [allowedPageSizes]="[5, 10, 20]"
      (rowAction)="onGridAction($event)">
    </app-shared-data-grid>
  </div>
</div>
