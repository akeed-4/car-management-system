<app-report-container
  [title]="'REPORTS.GENERAL_JOURNAL.TITLE'"
  [subtitle]="'REPORTS.GENERAL_JOURNAL.SUBTITLE'"
  [icon]="'menu_book'"
  [showDateRange]="true"
  [showStoreFilter]="true"
  [showAccountFilter]="true"
  [loading]="loading"
  (filterChange)="onFilterChange($event)"
  (exportPdf)="onExportPdf()"
  (exportExcel)="onExportExcel()"
  (print)="onPrint()"
  (refresh)="onRefresh()">

  <app-report-grid
    [remoteDataSource]="remoteStore"
    [columns]="columns"
    [keyExpr]="'lineId'"
    [stateStorageKey]="'general-journal'"
    [remotePageSize]="20"
    [allowSorting]="true"
    [allowFiltering]="true"
    [allowGrouping]="true"
    [showGroupPanel]="true"
    [showSummary]="true"
    [height]="'600px'">
  </app-report-grid>

</app-report-container>
