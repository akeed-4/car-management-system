<app-report-container
  [title]="'REPORTS.BALANCE_SHEET.TITLE'"
  [subtitle]="'REPORTS.BALANCE_SHEET.SUBTITLE'"
  [icon]="'account_balance_wallet'"
  [showDateRange]="true"
  [showBranchFilter]="true"
  [showAccountFilter]="false"
  [loading]="loading"
  (filterChange)="onFilterChange($event)"
  (exportPdf)="onExportPdf()"
  (exportExcel)="onExportExcel()"
  (print)="onPrint()"
  (refresh)="onRefresh()">

  <app-report-tree
    [dataSource]="reportData"
    [columns]="columns"
    [keyExpr]="'accountId'"
    [parentIdExpr]="'parentId'"
    [hasItemsExpr]="'hasChildren'"
    [allowSorting]="false"
    [allowFiltering]="true"
    [autoExpandAll]="true"
    [showSummary]="false"
    [height]="'600px'">
  </app-report-tree>

</app-report-container>
