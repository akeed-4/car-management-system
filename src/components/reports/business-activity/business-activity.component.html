<app-report-container
  [title]="'REPORTS.BUSINESS_ACTIVITY.TITLE'"
  [subtitle]="'REPORTS.BUSINESS_ACTIVITY.SUBTITLE'"
  [icon]="'trending_up'"
  [showDateRange]="true"
  [showStoreFilter]="true"
  [showAccountFilter]="false"
  [loading]="loading"
  (filterChange)="onFilterChange($event)"
  (exportPdf)="onExportPdf()"
  (exportExcel)="onExportExcel()"
  (print)="onPrint()"
  (refresh)="onRefresh()">

  <ng-template #reportBody>
    <app-report-grid
      [dataSource]="reportData"
      [loading]="loading"
      [columns]="columns"
      [keyExpr]="'activityType'"
      [stateStorageKey]="'business-activity'"
      [allowSorting]="true"
      [allowFiltering]="true"
      [allowGrouping]="true"
      [showGroupPanel]="true"
      [showSummary]="true"
      [summaryItems]="summaryItems"
      [height]="'600px'"
      [noDataText]="hasSearched ? 'REPORTS.NO_DATA' : 'REPORTS.APPLY_FILTER_PROMPT'">
    </app-report-grid>
  </ng-template>

</app-report-container>
