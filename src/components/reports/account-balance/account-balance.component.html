<app-report-container
  [title]="'REPORTS.ACCOUNT_BALANCE.TITLE'"
  [subtitle]="'REPORTS.ACCOUNT_BALANCE.SUBTITLE'"
  [icon]="'account_balance'"
  [showDateRange]="true"
  [showStoreFilter]="true"
  [showAccountFilter]="false"
  [loading]="loading"
  (filterChange)="onFilterChange($event)"
  (exportPdf)="onExportPdf()"
  (exportExcel)="onExportExcel()"
  (print)="onPrint()"
  (refresh)="onRefresh()">

  <!-- The report body must be a projected template (see report-container's reportBody doc):
       raw projected content between the container tags never mounts in the container's mobile
       @if branch, which is exactly why reports showed no data on phones. -->
  <ng-template #reportBody>
    <app-report-grid
      [dataSource]="reportData"
      [loading]="loading"
      [columns]="columns"
      [keyExpr]="'accountId'"
      [stateStorageKey]="'account-balance'"
      [allowSorting]="true"
      [allowFiltering]="true"
      [allowGrouping]="false"
      [showSummary]="true"
      [height]="'600px'"
      [noDataText]="hasSearched ? 'REPORTS.NO_DATA' : 'REPORTS.APPLY_FILTER_PROMPT'">
    </app-report-grid>
  </ng-template>

</app-report-container>
