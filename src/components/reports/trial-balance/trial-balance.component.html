<app-report-container
  [title]="'REPORTS.TRIAL_BALANCE.TITLE'"
  [subtitle]="'REPORTS.TRIAL_BALANCE.SUBTITLE'"
  [icon]="'balance'"
  [showDateRange]="true"
  [showStoreFilter]="true"
  [showAccountFilter]="false"
  [loading]="loading"
  (filterChange)="onFilterChange($event)"
  (exportPdf)="onExportPdf()"
  (exportExcel)="onExportExcel()"
  (print)="onPrint()"
  (refresh)="onRefresh()">

  <ng-template #reportBody>
    <app-report-grid
      [dataSource]="reportData"
      [loading]="loading"
      [columns]="columns"
      [keyExpr]="'accountId'"
      [stateStorageKey]="'trial-balance'"
      [allowSorting]="true"
      [allowFiltering]="true"
      [allowGrouping]="false"
      [showSummary]="true"
      [height]="'600px'"
      [noDataText]="hasSearched ? 'REPORTS.NO_DATA' : 'REPORTS.APPLY_FILTER_PROMPT'">
    </app-report-grid>
  </ng-template>

</app-report-container>
