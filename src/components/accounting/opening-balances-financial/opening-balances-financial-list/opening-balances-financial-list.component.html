<mat-card>
    <mat-card-header>
      <mat-card-title>{{ translate.instant('ACCOUNTING.OPENING_BALANCES_FINANCIAL') }}</mat-card-title>
      <div class="spacer"></div>
      <button mat-raised-button color="primary" (click)="navigateToNewForm()">
        <mat-icon>add</mat-icon>
        {{ translate.instant('COMMON.NEW') }}
      </button>
    </mat-card-header>
    <mat-card-content>
      <div class="data-grid-container">
        <dx-data-grid
          [dataSource]="openingBalances"
          [showBorders]="true"
          [showRowLines]="true"
          [showColumnLines]="true"
          [allowColumnReordering]="true"
          [allowColumnResizing]="true"
          [columnAutoWidth]="true"
          [wordWrapEnabled]="true"
          [rtlEnabled]="true"
          [height]="500"
          [noDataText]="translate.instant('ACCOUNTING.NO_OPENING_BALANCES')"
          [showBorders]="true"
          [rowAlternationEnabled]="true"
          [filterRow]="{ visible: true }"
          [headerFilter]="{ visible: true }"
          [groupPanel]="{ visible: true }"
          [scrolling]="{ mode: 'standard' }"
          [paging]="{ pageSize: 20 }"
          [pager]="{
            showPageSizeSelector: true,
            allowedPageSizes: [10, 20, 50],
            showInfo: true,
            showNavigationButtons: true
          }"
          [searchPanel]="{ visible: true, placeholder: translate.instant('ACCOUNTING.SEARCH_OPENING_BALANCES') }"
          [editing]="{
            mode: 'cell',
            allowUpdating: true,
            allowDeleting: true,
            allowAdding: false
          }"
        >
          <dxi-column
            dataField="accountName"
            [caption]="translate.instant('ACCOUNTING.ACCOUNT_NAME')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="accountType"
            [caption]="translate.instant('ACCOUNTING.ACCOUNT_TYPE')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="openingBalance"
            [caption]="translate.instant('ACCOUNTING.OPENING_BALANCE')"
            dataType="number"
            format="currency">
          </dxi-column>
          <dxi-column
            dataField="currency"
            [caption]="translate.instant('ACCOUNTING.CURRENCY')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="notes"
            [caption]="translate.instant('ACCOUNTING.NOTES_EN')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="entryDate"
            [caption]="translate.instant('ACCOUNTING.ENTRY_DATE')"
            dataType="date"
            format="dd/MM/yyyy">
          </dxi-column>
          <dxi-column type="buttons">
            <dxi-button name="edit" [hint]="translate.instant('ACCOUNTING.EDIT')" icon="edit" (onClick)="onEdit($event.row.data)"></dxi-button>
            <dxi-button name="delete" [hint]="translate.instant('ACCOUNTING.DELETE')" icon="trash" (onClick)="onDelete($event.row.data)"></dxi-button>
          </dxi-column>

          <dxo-filter-row [visible]="true"></dxo-filter-row>
          <dxo-header-filter [visible]="true"></dxo-header-filter>
          <dxo-grouping [autoExpandAll]="false" [contextMenuEnabled]="true"></dxo-grouping>
          <dxo-scrolling mode="standard" columnRenderingMode="standard" rowRenderingMode="standard" [useNative]="false"
            [scrollByContent]="true" [scrollByThumb]="true"></dxo-scrolling>
          <dxo-editing
            mode="cell"
            [allowUpdating]="true"
            [allowDeleting]="true"
            [allowAdding]="false">
          </dxo-editing>
        </dx-data-grid>
      </div>
    </mat-card-content>
  </mat-card>
