<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'ACCOUNTING.CHART_OF_ACCOUNTS' | translate }}</h2>
    </div>
  </div>

  <div class="content">
    <!-- Create New Account Section -->
    <div class="form-section">
      <app-add-account
        [isEditing]="isEditing"
        [editingAccount]="editingAccount"
        (accountSaved)="onAccountSaved($event)"
        (cancelled)="onCancel()">
      </app-add-account>
    </div>
  </div>
</div>
