<div class="tree-container" dir="rtl">
  <div class="header">
    <h2>{{ 'ACCOUNTING.CHART_OF_ACCOUNTS_HIERARCHY' | translate }}</h2>
    <p class="subtitle">{{ 'ACCOUNTING.HIERARCHICAL_VIEW_DESCRIPTION' | translate }}</p>
  </div>

  <div class="tree-section">
    <dx-tree-list
      id="accountsHierarchyTreeList"
      [dataSource]="accounts"
      keyExpr="id"
      parentIdExpr="parentId"
      [columns]="columns"
      [showRowLines]="true"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="true"
      [rtlEnabled]="true"
      [autoExpandAll]="true"
      [hoverStateEnabled]="true"
      [rowAlternationEnabled]="true">
      
      <!-- Level Column Template with Icon and Number -->
      <div *dxTemplate="let data of 'levelTemplate'">
        <div class="level-cell" [style.color]="getLevelColor(data.value)">
          <i class="dx-icon dx-icon-{{ getLevelIcon(data.value) }}"></i>
          <span class="level-number">{{ data.value }}</span>
        </div>
      </div>

      <!-- Name Column Template with Hierarchy Indication -->
      <div *dxTemplate="let data of 'nameTemplate'">
        <div class="name-cell" [class.has-children]="hasChildren(data.data)">
          <span class="account-name" [style.font-size]="(20 - data.value) + 'px'">{{ data.value }}</span>
        </div>
      </div>
    </dx-tree-list>
  </div>
</div>
