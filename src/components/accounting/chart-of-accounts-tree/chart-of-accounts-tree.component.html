<div class="tree-container" dir="rtl">
  <div class="header-card">
    <div class="header-content">
      <div class="header-text">
        <h2 class="header-title">{{ 'ACCOUNTING.CHART_OF_ACCOUNTS_HIERARCHY' | translate }}</h2>
        <p class="header-subtitle">{{ 'ACCOUNTING.HIERARCHICAL_VIEW_DESCRIPTION' | translate }}</p>
      </div>
      <div class="header-actions">
        <button class="btn-refresh" (click)="loadAccounts()">
          <i class="dx-icon-refresh"></i>
          {{ 'ACCOUNTING.REFRESH' | translate }}
        </button>
      </div>
    </div>
  </div>

  <div class="tree-section">
    <div class="loading-overlay" *ngIf="isLoading()">
      <div class="spinner"></div>
      <p>{{ 'ACCOUNTING.LOADING' | translate }}</p>
    </div>

    <div class="error-message" *ngIf="error()">
      <i class="dx-icon-warning"></i>
      <p>{{ error() }}</p>
    </div>

    <dx-tree-list
      id="accountsHierarchyTreeList"
      [dataSource]="processedAccounts()"
      keyExpr="id"
      parentIdExpr="parentId"
      [showRowLines]="true"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="true"
      [rtlEnabled]="true"
      [autoExpandAll]="true"
      [hoverStateEnabled]="true"
      [rowAlternationEnabled]="true"
      [scrolling]="{ mode: 'virtual' }"
      [filterRow]="{ visible: true }"
      [headerFilter]="{ visible: true }"
      [searchPanel]="{ visible: true, width: 240, placeholder: translate.instant('ACCOUNTING.SEARCH') }">
      
      <dxo-column-chooser #columnChooser [enabled]="true" mode="select" title="{{'dxDataGrid.columnChooser' | translate}}">
        <dxo-search [enabled]="true" [editorOptions]="true"></dxo-search>
        <dxo-selection [allowSelectAll]="true" [selectByClick]="true" [recursive]="true"></dxo-selection>
      </dxo-column-chooser>


      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-selection mode="single"></dxo-selection>
      <dxo-scrolling mode="standard" columnRenderingMode="standard" rowRenderingMode="standard" [useNative]="false" [scrollByContent]="true" [scrollByThumb]="true"></dxo-scrolling>
      <dxo-paging [pageSize]="20"></dxo-paging>
      <dxo-pager
        [visible]="true"
        [allowedPageSizes]="[10,20,50,100,'all']"
        [displayMode]="'compact'"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true">
      </dxo-pager>
      <dxo-sorting mode="multiple"></dxo-sorting>
      
      <dxi-column 
        dataField="level" 
        [caption]="translate.instant('ACCOUNTING.LEVEL')" 
        alignment="center"
       >
      </dxi-column>

      <dxi-column 
        dataField="code" 
        [caption]="translate.instant('ACCOUNTING.ACCOUNT_CODE')" 
        cssClass="code-column">
      </dxi-column>

      <dxi-column 
        dataField="translatedName" 
        [caption]="translate.instant('ACCOUNTING.ACCOUNT_NAME')"
        cssClass="name-column">
      </dxi-column>

      <dxi-column 
        dataField="accountTypeId" 
        [caption]="translate.instant('ACCOUNTING.ACCOUNT_TYPE')"
       >
        <dxo-lookup 
          [dataSource]="[
            { value: 1, display: translate.instant('ACCOUNTING.TYPE_ASSET') },
            { value: 2, display: translate.instant('ACCOUNTING.TYPE_LIABILITY') },
            { value: 3, display: translate.instant('ACCOUNTING.TYPE_EQUITY') },
            { value: 4, display: translate.instant('ACCOUNTING.TYPE_REVENUE') },
            { value: 5, display: translate.instant('ACCOUNTING.TYPE_EXPENSE') }
          ]"
          valueExpr="value"
          displayExpr="display">
        </dxo-lookup>
      </dxi-column>

      <dxi-column 
        dataField="balance" 
        [caption]="translate.instant('ACCOUNTING.BALANCE')" 
        dataType="number"
        alignment="right"
        cssClass="balance-column"
        [format]="{ type: 'currency', currency: 'SAR', precision: 2 }">
      </dxi-column>

      <dxi-column 
        dataField="isActive" 
        [caption]="translate.instant('ACCOUNTING.STATUS')"
        alignment="center"
        cssClass="status-column">
        <dxo-lookup 
          [dataSource]="[
            { value: true, display: translate.instant('ACCOUNTING.ACTIVE') },
            { value: false, display: translate.instant('ACCOUNTING.INACTIVE') }
          ]"
          valueExpr="value"
          displayExpr="display">
        </dxo-lookup>
      </dxi-column>

      <dxi-column 
        type="buttons" 
        [caption]="translate.instant('ACCOUNTING.ACTIONS')" 
        alignment="center"
        [fixed]="true"
        fixedPosition="left"
        cssClass="actions-column">
        <dxi-button 
          [hint]="translate.instant('ACCOUNTING.ADD_ACCOUNT')"
          icon="add"
          [onClick]="onAddSubAccount">
        </dxi-button>
        <dxi-button 
          [hint]="translate.instant('ACCOUNTING.EDIT_ACCOUNT')"
          icon="edit"
          [onClick]="onEditAccount">
        </dxi-button>
        <dxi-button 
          [hint]="translate.instant('ACCOUNTING.DELETE_ACCOUNT')"
          icon="trash"
          [onClick]="onDeleteAccount">
        </dxi-button>
      </dxi-column>
      
    </dx-tree-list>
  </div>
 
  <ng-template #levelTemplate let-data>
    <div class="level-cell">
      <span class="level-indicator">
        <span class="level-arrow">▶</span>
        Level {{ data.value }}
      </span>
    </div>
  </ng-template>

  <!-- Account Form Section -->
  <div class="form-section" *ngIf="isEditing || parentId">
    <app-add-account
      [isEditing]="isEditing"
      [editingAccount]="editingAccount"
      [parentId]="parentId"
      (accountSaved)="onAccountSaved($event)"
      (cancelled)="onCancel()">
    </app-add-account>
  </div>
</div>
