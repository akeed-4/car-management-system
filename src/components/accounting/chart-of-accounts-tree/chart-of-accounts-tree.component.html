<div class="tree-container" dir="rtl">
  <div class="header-card">
    <div class="header-content">
      <div class="header-text">
        <h2 class="header-title">{{ 'ACCOUNTING.CHART_OF_ACCOUNTS_HIERARCHY' | translate }}</h2>
        <p class="header-subtitle">{{ 'ACCOUNTING.HIERARCHICAL_VIEW_DESCRIPTION' | translate }}</p>
      </div>
      <div class="header-actions">
        <button class="btn-refresh" (click)="loadAccounts()">
          <i class="dx-icon-refresh"></i>
          {{ 'ACCOUNTING.REFRESH' | translate }}
        </button>
      </div>
    </div>
  </div>

  <div class="tree-section">
    <div class="loading-overlay" *ngIf="isLoading()">
      <div class="spinner"></div>
      <p>{{ 'ACCOUNTING.LOADING' | translate }}</p>
    </div>

    <div class="error-message" *ngIf="error()">
      <i class="dx-icon-warning"></i>
      <p>{{ error() }}</p>
    </div>

    <dx-tree-list
      id="accountsHierarchyTreeList"
      [dataSource]="processedAccounts()"
      keyExpr="id"
      parentIdExpr="parentId"
      [showRowLines]="true"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="true"
      [rtlEnabled]="true"
      [autoExpandAll]="true"
      [hoverStateEnabled]="true"
      [rowAlternationEnabled]="true"
      [scrolling]="{ mode: 'virtual' }"
      [filterRow]="{ visible: true }"
      [headerFilter]="{ visible: true }"
      [searchPanel]="{ visible: true, width: 240, placeholder: translate.instant('ACCOUNTING.SEARCH') }"
      [columnChooser]="{ enabled: true }">
      
      <dxi-column 
        dataField="level" 
        [caption]="translate.instant('ACCOUNTING.LEVEL')" 
        [width]="100" 
        alignment="center"
        [allowFiltering]="false"
        cssClass="level-column">
      </dxi-column>

      <dxi-column 
        dataField="code" 
        [caption]="translate.instant('ACCOUNTING.ACCOUNT_CODE')" 
        [width]="150"
        cssClass="code-column">
      </dxi-column>

      <dxi-column 
        dataField="translatedName" 
        [caption]="translate.instant('ACCOUNTING.ACCOUNT_NAME')"
        [minWidth]="250"
        cssClass="name-column">
      </dxi-column>

      <dxi-column 
        dataField="accountTypeId" 
        [caption]="translate.instant('ACCOUNTING.ACCOUNT_TYPE')"
        [width]="150">
        <dxo-lookup 
          [dataSource]="[
            { value: 1, display: translate.instant('ACCOUNTING.TYPE_ASSET') },
            { value: 2, display: translate.instant('ACCOUNTING.TYPE_LIABILITY') },
            { value: 3, display: translate.instant('ACCOUNTING.TYPE_EQUITY') },
            { value: 4, display: translate.instant('ACCOUNTING.TYPE_REVENUE') },
            { value: 5, display: translate.instant('ACCOUNTING.TYPE_EXPENSE') }
          ]"
          valueExpr="value"
          displayExpr="display">
        </dxo-lookup>
      </dxi-column>

      <dxi-column 
        dataField="balance" 
        [caption]="translate.instant('ACCOUNTING.BALANCE')" 
        dataType="number"
        [width]="150"
        alignment="right"
        cssClass="balance-column"
        [format]="{ type: 'currency', currency: 'SAR', precision: 2 }">
      </dxi-column>

      <dxi-column 
        dataField="isActive" 
        [caption]="translate.instant('ACCOUNTING.STATUS')"
        [width]="120"
        alignment="center"
        cssClass="status-column">
        <dxo-lookup 
          [dataSource]="[
            { value: true, display: translate.instant('ACCOUNTING.ACTIVE') },
            { value: false, display: translate.instant('ACCOUNTING.INACTIVE') }
          ]"
          valueExpr="value"
          displayExpr="display">
        </dxo-lookup>
      </dxi-column>

      <dxi-column 
        type="buttons" 
        [caption]="translate.instant('ACCOUNTING.ACTIONS')" 
        [width]="180"
        alignment="center"
        [fixed]="true"
        fixedPosition="right"
        cssClass="actions-column">
        <dxi-button 
          [hint]="translate.instant('ACCOUNTING.ADD_ACCOUNT')"
          icon="add"
          [onClick]="onAddSubAccount">
        </dxi-button>
        <dxi-button 
          [hint]="translate.instant('ACCOUNTING.EDIT_ACCOUNT')"
          icon="edit"
          [onClick]="onEditAccount">
        </dxi-button>
        <dxi-button 
          [hint]="translate.instant('ACCOUNTING.DELETE_ACCOUNT')"
          icon="trash"
          [onClick]="onDeleteAccount">
        </dxi-button>
      </dxi-column>
      
    </dx-tree-list>
  </div>
</div>
