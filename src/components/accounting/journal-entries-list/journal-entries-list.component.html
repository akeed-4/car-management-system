<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'ACCOUNTING.JOURNAL_ENTRIES_LIST' | translate }}</h2>
      <p class="erp-page-subtitle">{{ 'ACCOUNTING.JOURNAL_ENTRIES_LIST_SUBTITLE' | translate }}</p>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" (click)="onAddNew()">
        <mat-icon>add</mat-icon>
        <span>{{ 'ACCOUNTING.ADD_NEW_ENTRY' | translate }}</span>
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
      <dx-data-grid
        [dataSource]="journalEntries()"
        [showBorders]="true"
        [showRowLines]="true"
        keyexpr="id"
        [showColumnLines]="true"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        [columnAutoWidth]="true"
        [wordWrapEnabled]="true"
        [rtlEnabled]="true"
        [height]="600"
        [noDataText]="translate.instant('ACCOUNTING.NO_JOURNAL_ENTRIES')"
        [showBorders]="true"
        [rowAlternationEnabled]="true"
        [filterRow]="{ visible: true }"
        [headerFilter]="{ visible: true }"
        [groupPanel]="{ visible: true }"
        [scrolling]="{ mode: 'standard' }"
        [paging]="{ pageSize: 20 }"
        [pager]="{
          showPageSizeSelector: true,
          allowedPageSizes: [10, 20, 50],
          showInfo: true,
          showNavigationButtons: true
        }"
        [searchPanel]="{ visible: true, placeholder: translate.instant('ACCOUNTING.SEARCH_JOURNAL_ENTRIES') }"
        [export]="{ enabled: true, fileName: 'journal-entries' }"
      >

        <dxi-column dataField="id" [caption]="'ACCOUNTING.ENTRY_NUMBER' | translate" [width]="120" alignment="right"></dxi-column>
        <dxi-column dataField="entryDate" [caption]="'ACCOUNTING.ENTRY_DATE' | translate" dataType="date" format="yyyy-MM-dd" [width]="120" alignment="right"></dxi-column>
        <dxi-column dataField="description" [caption]="'ACCOUNTING.DESCRIPTION' | translate" [minWidth]="200" alignment="right"></dxi-column>
        <dxi-column dataField="totalCredit" [caption]="'ACCOUNTING.AMOUNT' | translate" dataType="number" format="currency" [width]="130" alignment="right">
          <dxo-format type="currency" currency="SAR"></dxo-format>
        </dxi-column>
        <dxi-column dataField="status" [caption]="'ACCOUNTING.STATUS' | translate" [width]="100" alignment="center">
          <dxo-lookup [dataSource]="statusOptions" valueExpr="value" displayExpr="text"></dxo-lookup>
        </dxi-column>
        <dxi-column type="buttons" [width]="120" [caption]="'ACCOUNTING.ACTIONS' | translate">
          <dxi-button icon="edit" [onClick]="onEdit"  [hint]="'ACCOUNTING.EDIT' | translate" [visible]="isEditButtonVisible"></dxi-button>
          <dxi-button icon="trash"  [onClick]="onDelete" [hint]="'ACCOUNTING.DELETE' | translate" [visible]="isEditButtonVisible"></dxi-button>
        </dxi-column>

        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-header-filter [visible]="true"></dxo-header-filter>
        <dxo-grouping [autoExpandAll]="false" [contextMenuEnabled]="true"></dxo-grouping>
        <dxo-scrolling mode="standard" columnRenderingMode="standard" rowRenderingMode="standard" [useNative]="false"
          [scrollByContent]="true" [scrollByThumb]="true"></dxo-scrolling>
        <dxo-selection mode="single"></dxo-selection>
        <dxo-paging [pageSize]="20"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]" [showInfo]="true"></dxo-pager>
        <dxo-export [enabled]="true" [fileName]="'journal-entries'"></dxo-export>
      </dx-data-grid>
  </div>
</div>
