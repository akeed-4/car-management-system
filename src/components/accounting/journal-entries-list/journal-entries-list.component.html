<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'ACCOUNTING.JOURNAL_ENTRIES_LIST' | translate }}</h2>
      <p class="erp-page-subtitle">{{ 'ACCOUNTING.JOURNAL_ENTRIES_LIST_SUBTITLE' | translate }}</p>
    </div>
    <div class="erp-page-actions">
      <button *appHasPermission="'journalentries.view'" mat-raised-button color="primary" (click)="onAddNew()">
        <mat-icon>add</mat-icon>
        <span>{{ 'ACCOUNTING.ADD_NEW_ENTRY' | translate }}</span>
      </button>
    </div>
  </div>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="filteredJournalEntries()"
      [fields]="mobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      [actions]="mobileActions"
      searchPlaceholder="ACCOUNTING.SEARCH_JOURNAL_ENTRIES"
      emptyMessage="ACCOUNTING.NO_JOURNAL_ENTRIES"
      (searchChange)="filter.set($event)"
      (action)="onMobileAction($event)">
    </shared-mobile-list>
  } @else {
  <div class="erp-grid-card">
    <app-shared-data-grid
      [dataSource]="journalEntries()"
      [columns]="columns"
      [rowActions]="rowActions"
      [showGroupPanel]="true"
      [showColumnChooser]="false"
      selectionMode="single"
      keyExpr="id"
      [rtlEnabled]="true"
      [height]="600"
      searchPlaceholder="ACCOUNTING.SEARCH_JOURNAL_ENTRIES"
      noDataText="ACCOUNTING.NO_JOURNAL_ENTRIES"
      exportFileName="journal-entries"
      [pageSize]="20"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">
    </app-shared-data-grid>
  </div>
  }
</div>
