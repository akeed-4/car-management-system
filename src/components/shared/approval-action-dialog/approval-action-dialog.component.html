<h2 mat-dialog-title class="dialog-title">
  <mat-icon>{{ iconName }}</mat-icon>
  {{ titleKey | translate }}
</h2>

<form [formGroup]="form" (ngSubmit)="confirm()">
  <mat-dialog-content>
    <p class="doc-ref">{{ data.documentNumber }}</p>

    <mat-form-field appearance="outline" class="full-width" *ngIf="data.requireReason">
      <mat-label>{{ 'DOCUMENT_LIFECYCLE.REASON' | translate }}</mat-label>
      <textarea matInput formControlName="reason" rows="3" required></textarea>
      <mat-error *ngIf="form.get('reason')?.hasError('required')">
        {{ 'DOCUMENT_LIFECYCLE.REASON_REQUIRED' | translate }}
      </mat-error>
      <mat-error *ngIf="form.get('reason')?.hasError('minlength')">
        {{ 'DOCUMENT_LIFECYCLE.REASON_TOO_SHORT' | translate }}
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()">{{ 'COMMON.CANCEL' | translate }}</button>
    <button mat-raised-button color="primary" type="submit">{{ confirmKey | translate }}</button>
  </mat-dialog-actions>
</form>
