
<mat-toolbar color="primary" class="page-header">
  <span>{{ 'ACCOUNTS.DEPOSITS.LIST_TITLE' | translate }}</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" routerLink="/accounts/deposits/new">
    <mat-icon>add</mat-icon>
    <span>{{ 'ACCOUNTS.DEPOSITS.NEW' | translate }}</span>
  </button>
</mat-toolbar>

<div class="container">
  <mat-card class="list-card">
    <mat-card-content>
      <dx-data-grid
        [dataSource]="deposits()"
        [showBorders]="true"
        [showRowLines]="true"
        [showColumnLines]="true"
        [rowAlternationEnabled]="true"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        [columnAutoWidth]="true"
        [rtlEnabled]="true"
        keyExpr="id">

        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[5, 10, 20]"
          [showInfo]="true">
        </dxo-pager>

        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-header-filter [visible]="true"></dxo-header-filter>
        <dxo-search-panel
          [visible]="true"
          placeholder="{{ 'ACCOUNTS.DEPOSITS.SEARCH_PLACEHOLDER' | translate }}">
        </dxo-search-panel>

        <dxi-column
          dataField="voucherNumber"
          caption="{{ 'ACCOUNTS.DEPOSITS.COL_VOUCHER_NUMBER' | translate }}"
          >
        </dxi-column>

        <dxi-column
          dataField="date"
          caption="{{ 'ACCOUNTS.DEPOSITS.COL_DATE' | translate }}"
          dataType="date"
          format="yyyy-MM-dd"
          >
        </dxi-column>

        <dxi-column
          dataField="customerName"
          caption="{{ 'ACCOUNTS.DEPOSITS.COL_CUSTOMER' | translate }}"
          >
        </dxi-column>

        <dxi-column
          dataField="carDescription"
          caption="{{ 'ACCOUNTS.DEPOSITS.COL_CAR' | translate }}"
         >
        </dxi-column>

        <dxi-column
          dataField="amount"
          caption="{{ 'ACCOUNTS.DEPOSITS.COL_AMOUNT' | translate }}"
          dataType="number"
          format="currency"
          >
        </dxi-column>

        <dxi-column
          caption="{{ 'ACCOUNTS.ACTIONS' | translate }}"
          
          [allowFiltering]="false"
          [allowSorting]="false"
          cellTemplate="actionsTemplate">
        </dxi-column>

        <!-- Templates -->
        <div *dxTemplate="let data of 'actionsTemplate'">
          <div class="actions-cell">
            <button mat-icon-button matTooltip="عرض/تعديل" color="primary">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </div>
      </dx-data-grid>
    </mat-card-content>
  </mat-card>
</div>
