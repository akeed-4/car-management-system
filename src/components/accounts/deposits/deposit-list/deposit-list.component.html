
<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'ACCOUNTS.DEPOSITS.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="primary" routerLink="/accounts/deposits/new">
        <mat-icon>add</mat-icon>
        <span>{{ 'ACCOUNTS.DEPOSITS.NEW' | translate }}</span>
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <app-shared-data-grid
      [dataSource]="deposits()"
      [columns]="columns"
      [rowActions]="rowActions"
      keyExpr="id"
      searchPlaceholder="ACCOUNTS.DEPOSITS.SEARCH_PLACEHOLDER"
      (rowAction)="onGridAction($event)">
    </app-shared-data-grid>
  </div>
</div>
