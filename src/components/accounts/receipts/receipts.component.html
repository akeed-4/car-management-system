<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'ACCOUNTS.RECEIPTS.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <a mat-raised-button color="primary" routerLink="/accounts/receipts/new">
        <mat-icon>add</mat-icon>
        {{ 'ACCOUNTS.RECEIPTS.NEW' | translate }}
      </a>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: owns grid chrome, row actions, and the mobile card-list
         rendering (same rows/actions as before). -->
    <app-shared-data-grid
      [dataSource]="dataSource"
      [columns]="columns"
      [rowActions]="rowActions"
      [summaryItems]="summaryItems"
      keyExpr="id"
      searchPlaceholder="ACCOUNTS.RECEIPTS.SEARCH_PLACEHOLDER"
      noDataText="COMMON.NO_DATA"
      [mobileItems]="mobileReceipts()"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      (rowAction)="onGridAction($event)">

      <!-- Mobile per-row actions (same edit/delete behavior as before) -->
      <ng-template let-item>
        <button type="button" class="btn btn-light" (click)="mobileEdit(item)">{{ 'ACCOUNTS.RECEIPTS.EDIT' | translate }}</button>
        <button type="button" class="btn btn-light" (click)="mobileDelete(item)">{{ 'ACCOUNTS.RECEIPTS.DELETE' | translate }}</button>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
