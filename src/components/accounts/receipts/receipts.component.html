<mat-toolbar color="primary" class="page-header">
  <mat-toolbar-row>
    <span>{{ 'ACCOUNTS.RECEIPTS.LIST_TITLE' | translate }}</span>
    <span class="spacer"></span>
    <a mat-raised-button color="accent" routerLink="/accounts/receipts/new">
      <mat-icon>add</mat-icon>
      {{ 'ACCOUNTS.RECEIPTS.NEW' | translate }}
    </a>
  </mat-toolbar-row>
</mat-toolbar>

<mat-card class="receipts-card">
  <mat-card-content>
    <div class="search-section">
      <!-- Search is now handled by the grid -->
    </div>

    <dx-data-grid
      [dataSource]="dataSource"
      [remoteOperations]="true"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [rtlEnabled]="true"
      [wordWrapEnabled]="false"
      [columnAutoWidth]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      keyExpr="id"
      class="receipts-grid">

      <dxo-search-panel
        [visible]="true">
      </dxo-search-panel>

      <dxo-grouping [autoExpandAll]="false"></dxo-grouping>

      <dxo-paging
        [pageSize]="10">
        <dxo-pager
          [visible]="true"
          [allowedPageSizes]="[5, 10, 20]"
          [displayMode]="'compact'"
          [showPageSizeSelector]="true"
          [showInfo]="true"
          [showNavigationButtons]="true">
        </dxo-pager>
      </dxo-paging>

      <dxo-filter-row [visible]="true"></dxo-filter-row>

      <dxo-header-filter [visible]="true"></dxo-header-filter>

      <dxi-column
        dataField="voucherNumber"
        [caption]="'ACCOUNTS.RECEIPTS.COL_VOUCHER_NUMBER' | translate"
        [alignment]="'right'"
       >
      </dxi-column>

      <dxi-column
        dataField="date"
        [caption]="'ACCOUNTS.RECEIPTS.COL_DATE' | translate"
        dataType="date"
        format="yyyy-MM-dd"
        [alignment]="'right'"
        >
      </dxi-column>

      <dxi-column
        dataField="customerName"
        [caption]="'ACCOUNTS.RECEIPTS.COL_CUSTOMER' | translate"
        [alignment]="'right'"
      >
      </dxi-column>

      <dxi-column
        dataField="salesInvoiceNumber"
        [caption]="'ACCOUNTS.RECEIPTS.COL_INVOICE' | translate"
        [alignment]="'right'"
       >
      </dxi-column>

      <dxi-column
        dataField="amount"
        [caption]="'ACCOUNTS.RECEIPTS.COL_AMOUNT' | translate"
        dataType="number"
        format="currency"
        [alignment]="'right'"
        >
        <dxo-format
          type="currency"
          [precision]="2"
          currency="SAR">
        </dxo-format>
      </dxi-column>
   <dxi-column
        type="buttons"
        [width]="120"
        [caption]="'ACCOUNTS.RECEIPTS.COL_ACTIONS' | translate">
        <dxi-button
        icon="edit"
          text="Edit"
          [onClick]="editReceipt">
        </dxi-button>
        <dxi-button
          icon="trash"
          text="Delete"
          [onClick]="deleteReceipt">
        </dxi-button>
      </dxi-column>
      <dxo-summary>
        <dxi-total-item
          column="amount"
          summaryType="sum"
          [alignment]="'right'"
          [displayFormat]="'ACCOUNTS.RECEIPTS.TOTAL_AMOUNT' | translate">
        </dxi-total-item>
      </dxo-summary>

    </dx-data-grid>
  </mat-card-content>
</mat-card>
