<mat-toolbar color="primary" class="page-header">
  <mat-toolbar-row>
    <span>{{ 'ACCOUNTS.PAYMENTS.LIST_TITLE' | translate }}</span>
    <span class="spacer"></span>
    <a mat-raised-button color="accent" routerLink="/accounts/payments/new">
      <mat-icon>add</mat-icon>
      {{ 'ACCOUNTS.PAYMENTS.NEW' | translate }}
    </a>
  </mat-toolbar-row>
</mat-toolbar>

<mat-card class="payments-card">
  <mat-card-content>
    <div class="search-section">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>{{ 'ACCOUNTS.PAYMENTS.SEARCH_PLACEHOLDER' | translate }}</mat-label>
        <input matInput type="text" (input)="onFilter($event)">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <dx-data-grid
      [dataSource]="filteredAndSortedPayments()"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [rtlEnabled]="true"
      [wordWrapEnabled]="false"
      [columnAutoWidth]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      keyExpr="id"
      class="payments-grid">

      <dxo-search-panel
        [visible]="false">
      </dxo-search-panel>

      <dxo-grouping [autoExpandAll]="false"></dxo-grouping>

      <dxo-paging
        [pageSize]="10">
        <dxo-pager
          [visible]="true"
          [allowedPageSizes]="[5, 10, 20]"
          [displayMode]="'compact'"
          [showPageSizeSelector]="true"
          [showInfo]="true"
          [showNavigationButtons]="true">
        </dxo-pager>
      </dxo-paging>

      <dxo-filter-row [visible]="true"></dxo-filter-row>

      <dxo-header-filter [visible]="true"></dxo-header-filter>

      <dxi-column
        dataField="voucherNumber"
        [caption]="'ACCOUNTS.PAYMENTS.COL_VOUCHER_NUMBER' | translate"
        [alignment]="'right'"
       >
      </dxi-column>

      <dxi-column
        dataField="date"
        [caption]="'ACCOUNTS.PAYMENTS.COL_DATE' | translate"
        dataType="date"
        format="yyyy-MM-dd"
        [alignment]="'right'"
        >
      </dxi-column>

      <dxi-column
        dataField="supplierName"
        [caption]="'ACCOUNTS.PAYMENTS.COL_SUPPLIER' | translate"
        [alignment]="'right'"
       >
      </dxi-column>

      <dxi-column
        dataField="purchaseInvoiceNumber"
        [caption]="'ACCOUNTS.PAYMENTS.COL_INVOICE' | translate"
        [alignment]="'right'"
       >
      </dxi-column>

      <dxi-column
        dataField="amount"
        [caption]="'ACCOUNTS.PAYMENTS.COL_AMOUNT' | translate"
        dataType="number"
        format="currency"
        [alignment]="'right'"
        >
        <dxo-format
          type="currency"
          [precision]="2"
          currency="SAR">
        </dxo-format>
      </dxi-column>

      <dxo-summary>
        <dxi-total-item
          column="amount"
          summaryType="sum"
          [alignment]="'right'"
          [displayFormat]="'ACCOUNTS.PAYMENTS.TOTAL_AMOUNT' | translate">
        </dxi-total-item>
      </dxo-summary>

    </dx-data-grid>
  </mat-card-content>
</mat-card>
