<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">Receipt Voucher</h2>
    </div>
    <div class="erp-page-actions">
      <a mat-stroked-button routerLink="/accounts/receipts">
        <mat-icon>arrow_back</mat-icon>
        Back
      </a>
    </div>
  </div>

  <div class="erp-card">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <!-- Header Info -->
        <div class="erp-section header-section">
          <mat-form-field appearance="outline">
            <mat-label>Total Amount</mat-label>
            <input matInput type="number" formControlName="totalAmount" required min="0.01">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Date</mat-label>
            <input matInput type="date" formControlName="date" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Payment Method</mat-label>
            <mat-select formControlName="paymentMethod" required>
              <mat-option *ngFor="let method of paymentMethods" [value]="method.value">{{ method.label }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Source Account</mat-label>
            <mat-select formControlName="sourceAccountId" required>
              <mat-option [value]="null" disabled>Select Account</mat-option>
              <mat-option *ngFor="let acc of accounts$ | async; trackBy: trackByAccountId" [value]="acc.id">{{ acc.accountCode }} - {{ acc.accountNameAr }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Details Table -->
        <div class="erp-section details-section">
          <h3 class="erp-section-title">Receipt Details</h3>
          <dx-data-grid
            [dataSource]="detailsData | async"
            [showBorders]="true"
            [allowColumnReordering]="true"
            [allowColumnResizing]="true"
            [columnAutoWidth]="true"
            [editing]="{ mode: 'cell', allowUpdating: true, allowAdding: true, allowDeleting: true }"
            (onRowUpdated)="onRowUpdated($event)">

            <dxo-paging [enabled]="false"></dxo-paging>
            <dxo-editing
              mode="cell"
              [allowUpdating]="true"
              [allowAdding]="true"
              [allowDeleting]="true">
            </dxo-editing>

            <dxi-column dataField="incomeAccountId" caption="Income Account">
              <dxo-lookup
                [dataSource]="accounts$ | async"
                valueExpr="id"
                displayExpr="accountNameAr">
              </dxo-lookup>
            </dxi-column>

            <dxi-column dataField="carId" caption="Car (Optional)">
              <dxo-lookup
                [dataSource]="cars$ | async"
                valueExpr="id"
                displayExpr="name">
              </dxo-lookup>
            </dxi-column>

            <dxi-column dataField="balance" caption="Outstanding Balance" [allowEditing]="false">
            </dxi-column>

            <dxi-column dataField="amount" caption="Amount" dataType="number">
            </dxi-column>

            <dxi-column dataField="note" caption="Note">
            </dxi-column>
          </dx-data-grid>

          <div class="table-footer">
            <button mat-stroked-button type="button" (click)="distributeEvenly()" *ngIf="(detailsData | async)?.length > 0">
              Distribute Evenly
            </button>
            <div class="erp-total-row">
              <span class="erp-total-label">Total</span>
              <span class="erp-total-value">{{ getTotalAmount() | currency:'SAR' }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="erp-actions-bar">
        <a mat-stroked-button routerLink="/accounts/receipts">
          Cancel
        </a>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
