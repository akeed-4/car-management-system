<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'BRANCHES.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      @if (!isMobile()) {
        <input
          type="text"
          [(ngModel)]="filter"
          placeholder="{{ 'BRANCHES.SEARCH_PLACEHOLDER' | translate }}"
          class="erp-search-input"
        />
      }
      <button
        mat-raised-button
        color="primary"
        (click)="onCreate()"
        appHasPermission="branch.create"
     >
        <mat-icon>add</mat-icon>
        {{ 'BRANCHES.ADD_NEW' | translate }}
      </button>
    </div>
  </div>

  @if (isMobile()) {
    <shared-mobile-list
      [data]="filteredBranches()"
      [fields]="mobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      [actions]="mobileActions"
      searchPlaceholder="BRANCHES.SEARCH_PLACEHOLDER"
      emptyMessage="COMMON.NO_DATA"
      (searchChange)="filter.set($event)"
      (action)="onMobileAction($event)">
    </shared-mobile-list>
  } @else {
    <div class="erp-grid-card">
      <app-shared-data-grid
        [dataSource]="filteredBranches()"
        [columns]="columns"
        [rowActions]="rowActions"
        keyExpr="id"
        selectionMode="single"
        searchPlaceholder="BRANCHES.SEARCH_PLACEHOLDER"
        height="70vh"
        scrollingMode="virtual"
        exportFileName="branches"
        [pageSize]="10"
        [allowedPageSizes]="[5, 10, 20]"
        (rowAction)="onGridAction($event)"
        (rowClick)="onGridRowClick($event)">
      </app-shared-data-grid>
    </div>
  }
</div>
