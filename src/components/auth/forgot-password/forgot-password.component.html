<div class="auth-container">
  <h2>{{ 'FORGOT_PASSWORD.TITLE' | translate }}</h2>

  <ng-container *ngIf="!submitted(); else successState">
    <p class="hint">{{ 'FORGOT_PASSWORD.HINT' | translate }}</p>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ 'FORGOT_PASSWORD.EMAIL' | translate }}</label>
        <input id="email" type="email" formControlName="email" />
        <div class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          {{ 'FORGOT_PASSWORD.EMAIL_ERROR' | translate }}
        </div>
      </div>

      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" [disabled]="isSubmitting()">{{ 'FORGOT_PASSWORD.SUBMIT' | translate }}</button>
    </form>
  </ng-container>

  <ng-template #successState>
    <p class="success">{{ 'FORGOT_PASSWORD.SUCCESS' | translate }}</p>
  </ng-template>

  <p class="alt-action">
    <a routerLink="/login">{{ 'FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}</a>
  </p>
</div>
