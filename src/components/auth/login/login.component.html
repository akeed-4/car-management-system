<div class="login-container">
  <h2>{{ 'LOGIN.TITLE' | translate }}</h2>

  <p class="success" *ngIf="passwordWasReset">{{ 'LOGIN.PASSWORD_RESET_SUCCESS' | translate }}</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">{{ 'LOGIN.EMAIL' | translate }}</label>
      <input id="email" type="string" formControlName="name" />
      <div class="error" *ngIf="loginForm.get('name')?.invalid && loginForm.get('name')?.touched">
        {{ 'LOGIN.EMAIL_ERROR' | translate }}
      </div>
    </div>

    <div class="form-group">
      <label for="password">{{ 'LOGIN.PASSWORD' | translate }}</label>
      <input id="password" type="password" formControlName="password" />
      <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        {{ 'LOGIN.PASSWORD_ERROR' | translate }}
      </div>
    </div>

    <div class="form-row">
      <label class="remember-me">
        <input type="checkbox" formControlName="rememberMe" />
        {{ 'LOGIN.REMEMBER_ME' | translate }}
      </label>
      <a routerLink="/forgot-password" class="forgot-link">{{ 'LOGIN.FORGOT_PASSWORD' | translate }}</a>
    </div>

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loggingIn()">
      {{ (loggingIn() ? 'LOGIN.SIGNING_IN' : 'LOGIN.SUBMIT') | translate }}
    </button>
  </form>

  <p class="alt-action">
    {{ 'LOGIN.NO_ACCOUNT' | translate }}
    <a routerLink="/registration">{{ 'LOGIN.SIGN_UP' | translate }}</a>
  </p>
</div>
