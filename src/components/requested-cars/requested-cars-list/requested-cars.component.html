<mat-toolbar color="primary" class="toolbar">
  <mat-toolbar-row>
    <span>{{ 'REQUESTED_CARS.LIST_TITLE' | translate }}</span>
    <span class="spacer"></span>
    <button mat-raised-button color="accent" routerLink="/requested-cars/new">
      <mat-icon>add</mat-icon>
      <span>{{ 'REQUESTED_CARS.ADD_NEW_REQUEST' | translate }}</span>
    </button>
  </mat-toolbar-row>
</mat-toolbar>

<div class="container">
  <mat-card class="list-card">
    <mat-card-content>
      <div class="controls-section">
        <mat-slide-toggle
          [checked]="showArchived()"
          (change)="showArchived.set($event.checked)">
          {{ 'REQUESTED_CARS.SHOW_ARCHIVED' | translate }}
        </mat-slide-toggle>
      </div>

      <dx-data-grid
        [dataSource]="filteredRequests()"
        [showBorders]="true"
        [showRowLines]="true"
        [showColumnLines]="true"
        [rowAlternationEnabled]="true"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        [columnAutoWidth]="true"
        [rtlEnabled]="true"
        keyExpr="id">

        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[5, 10, 20]"
          [showInfo]="true">
        </dxo-pager>

        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-header-filter [visible]="true"></dxo-header-filter>
        <dxo-search-panel
          [visible]="true"
          placeholder="{{ 'REQUESTED_CARS.SEARCH_PLACEHOLDER' | translate }}">
        </dxo-search-panel>

        <dxi-column
          dataField="requestDate"
          caption="{{ 'REQUESTED_CARS.COLUMNS.REQUEST_DATE' | translate }}"
          dataType="date"
          format="yyyy-MM-dd"
        >
        </dxi-column>

        <dxi-column
          caption="{{ 'REQUESTED_CARS.COLUMNS.CUSTOMER_INFO' | translate }}"
          cellTemplate="customerTemplate">
        </dxi-column>

        <dxi-column
          caption="{{ 'REQUESTED_CARS.COLUMNS.REQUESTED_CAR' | translate }}"
          cellTemplate="carTemplate">
        </dxi-column>

        <dxi-column
          dataField="status"
          caption="{{ 'REQUESTED_CARS.COLUMNS.STATUS' | translate }}"
          cellTemplate="statusTemplate">
        </dxi-column>

        <dxi-column
          caption="{{ 'REQUESTED_CARS.COLUMNS.ACTIONS' | translate }}"
          [allowFiltering]="false"
          [allowSorting]="false"
          cellTemplate="actionsTemplate">
        </dxi-column>

        <!-- Templates -->
        <div *dxTemplate="let data of 'customerTemplate'">
          <div class="customer-info">
            <div class="customer-name">{{ data.customerName }}</div>
            <div class="customer-phone">{{ data.customerPhone }}</div>
          </div>
        </div>

        <div *dxTemplate="let data of 'carTemplate'">
          <div class="car-info">
            <div class="car-model">{{ data.make }} {{ data.model }}</div>
            <div class="car-details">{{ data.year }} - {{ data.color }}</div>
          </div>
        </div>

        <div *dxTemplate="let data of 'statusTemplate'">
          <mat-chip
            [class]="getStatusClass(data.status)"
            selected>
            {{ getStatusText(data.status) }}
          </mat-chip>
        </div>

        <div *dxTemplate="let data of 'actionsTemplate'">
          <div class="actions-cell">
            <button
              *ngIf="!showArchived()"
              mat-icon-button
              (click)="editRequest(data.id)"
              matTooltip="{{ 'REQUESTED_CARS.ACTIONS.EDIT' | translate }}"
              color="primary">
              <mat-icon>edit</mat-icon>
            </button>

            <button
              *ngIf="!showArchived()"
              mat-icon-button
              (click)="deleteRequest(data.id)"
              matTooltip="{{ 'REQUESTED_CARS.ACTIONS.DELETE' | translate }}"
              color="warn">
              <mat-icon>delete</mat-icon>
            </button>

            <button
              *ngIf="!showArchived()"
              mat-icon-button
              (click)="archiveRequest(data.id)"
              matTooltip="{{ 'REQUESTED_CARS.ACTIONS.ARCHIVE' | translate }}"
              color="accent">
              <mat-icon>archive</mat-icon>
            </button>

            <button
              *ngIf="showArchived()"
              mat-icon-button
              (click)="unarchiveRequest(data.id)"
              matTooltip="{{ 'REQUESTED_CARS.ACTIONS.UNARCHIVE' | translate }}"
              color="accent">
              <mat-icon>unarchive</mat-icon>
            </button>
          </div>
        </div>
      </dx-data-grid>

    </mat-card-content>
  </mat-card>
</div>

<app-modal
  [isOpen]="isDeleteModalOpen()"
  title="{{ 'REQUESTED_CARS.MODAL.DELETE_TITLE' | translate }}"
  message="{{ 'REQUESTED_CARS.MODAL.DELETE_MESSAGE' | translate }}"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()">
</app-modal>
