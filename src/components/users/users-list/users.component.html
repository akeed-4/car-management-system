<div class="users-container">
  <div class="header-section">
    <div class="title-section">
      <h2>{{ 'USERS.LIST.TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'USERS.LIST.SUBTITLE' | translate }}</p>
    </div>
    <button mat-raised-button color="primary" class="add-button" (click)="createUser()" appHasPermission="users.create">
      <mat-icon>add</mat-icon>
      {{ 'USERS.LIST.ADD_NEW' | translate }}
    </button>
  </div>

  <div class="grid-section">
    <dx-data-grid
      id="usersGrid"
      [dataSource]="users()"
      keyExpr="id"
      [showBorders]="true"
      [showRowLines]="true"
      [rowAlternationEnabled]="true"
      [columnAutoWidth]="true"
      [hoverStateEnabled]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [rtlEnabled]="true"
      [noDataText]="'USERS.LIST.NO_USERS' | translate">

      <dxo-load-panel [enabled]="true"></dxo-load-panel>
      <dxo-paging [pageSize]="20"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]" [showInfo]="true"></dxo-pager>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-search-panel [visible]="true" [placeholder]="'USERS.LIST.SEARCH_PLACEHOLDER' | translate"></dxo-search-panel>

      <dxi-column dataField="name" [caption]="translate.instant('USERS.FORM.USERNAME')"></dxi-column>
      <dxi-column dataField="roleName" [caption]="translate.instant('USERS.FORM.ROLE')"></dxi-column>

      <dxi-column
        dataField="status"
        [caption]="translate.instant('USERS.FORM.STATUS')"
        cellTemplate="statusTemplate"
        [width]="130"
        alignment="center">
      </dxi-column>

      <dxi-column
        dataField="isLocked"
        [caption]="translate.instant('USERS.LIST.LOCK_STATUS')"
        cellTemplate="lockTemplate"
        [width]="130"
        alignment="center">
      </dxi-column>

      <dxi-column type="buttons" [width]="260" [caption]="translate.instant('USERS.LIST.ACTIONS')">
        <dxi-button
          [hint]="translate.instant('USERS.LIST.EDIT')"
          icon="edit"
          [visible]="canShowEdit"
          [onClick]="editClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('USERS.LIST.ASSIGN_ROLE')"
          icon="user"
          [visible]="canShowAssignRole"
          [onClick]="assignRoleClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('USERS.LIST.RESET_PASSWORD')"
          icon="key"
          [visible]="canShowResetPassword"
          [onClick]="resetPasswordClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('USERS.LIST.DEACTIVATE')"
          icon="close"
          [visible]="canShowDeactivate"
          [onClick]="deactivateClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('USERS.LIST.ACTIVATE')"
          icon="check"
          [visible]="canShowActivate"
          [onClick]="activateClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('USERS.LIST.LOCK')"
          icon="lock"
          [visible]="canShowLock"
          [onClick]="lockClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('USERS.LIST.UNLOCK')"
          icon="unlock"
          [visible]="canShowUnlock"
          [onClick]="unlockClick">
        </dxi-button>
        <dxi-button
          [hint]="translate.instant('USERS.LIST.DELETE')"
          icon="trash"
          [visible]="canShowDelete"
          [onClick]="deleteClick">
        </dxi-button>
      </dxi-column>

      <div *dxTemplate="let data of 'statusTemplate'">
        <mat-chip [color]="getStatusColor(data.value)" selected>
          {{ (data.value === 'Active' ? 'USERS.STATUS.ACTIVE' : 'USERS.STATUS.INACTIVE') | translate }}
        </mat-chip>
      </div>

      <div *dxTemplate="let data of 'lockTemplate'">
        <mat-chip [color]="data.value ? 'warn' : 'default'" selected>
          {{ (data.value ? 'USERS.STATUS.LOCKED' : 'USERS.STATUS.UNLOCKED') | translate }}
        </mat-chip>
      </div>
    </dx-data-grid>
  </div>
</div>

<app-modal
  [isOpen]="isConfirmModalOpen()"
  [title]="confirmModalTitle()"
  [message]="confirmModalMessage()"
  (confirm)="onConfirmAction()"
  (cancel)="closeConfirmModal()">
</app-modal>
