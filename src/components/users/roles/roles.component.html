<div class="roles-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <span class="erp-page-eyebrow">{{ 'ROLES.PAGE.BREADCRUMB' | translate }}</span>
      <h2 class="erp-page-title">
        <mat-icon class="erp-section-icon">security</mat-icon>
        {{ 'ROLES.PAGE.TITLE' | translate }}
      </h2>
      <p class="erp-page-subtitle">{{ 'ROLES.PAGE.SUBTITLE' | translate }}</p>
    </div>
  </div>

  <div class="roles-grid">
    <section class="erp-card panel role-list-container">
      <app-role-list-panel
        [roles]="rolesWithStats()"
        [selectedRoleId]="selectedRoleId()"
        [loading]="rolesLoading()"
        [newRoleName]="newRoleName()"
        [creatingRole]="creatingRole()"
        [duplicatingRoleId]="duplicatingRoleId()"
        [deletingRoleId]="deletingRoleId()"
        [exportingRoleId]="exportingRoleId()"
        (roleSelect)="onRoleSelect($event)"
        (createRole)="createRole()"
        (duplicateRole)="duplicateRole($event)"
        (deleteRole)="deleteRole($event)"
        (exportRole)="exportRole($event)"
        (newRoleNameChange)="onNewRoleNameChange($event)">
      </app-role-list-panel>
    </section>

    <section class="erp-card panel permission-panel-container">
      <app-permission-panel
        [permissionsList]="permissionsList()"
        [currentPermissions]="currentPermissions()"
        [originalPermissions]="originalPermissionsSnapshot()"
        [disabled]="selectedRoleId() === null"
        [loading]="permissionsLoading()"
        [saving]="savingPermissions()"
        [hasUnsavedChanges]="hasUnsavedChanges()"
        (permissionToggle)="togglePermission($event)"
        (groupToggle)="toggleGroup($event)"
        (save)="savePermissions()"
        (discard)="discardChanges()">
      </app-permission-panel>
    </section>
  </div>
</div>
