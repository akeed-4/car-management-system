<h2 mat-dialog-title>{{ 'USERS.RESET_PASSWORD.TITLE' | translate }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <p class="dialog-subtitle">{{ 'USERS.RESET_PASSWORD.SUBTITLE' | translate: { name: data.userName } }}</p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'USERS.RESET_PASSWORD.NEW_PASSWORD' | translate }}</mat-label>
      <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="newPassword" required>
      <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())">
        <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
        {{ 'USERS.VALIDATION.PASSWORD_MIN_LENGTH' | translate }}
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cancel()">{{ 'USERS.FORM.CANCEL' | translate }}</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving()">
      {{ 'USERS.RESET_PASSWORD.SUBMIT' | translate }}
    </button>
  </mat-dialog-actions>
</form>
