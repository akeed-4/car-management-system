<app-car-report-shell
  *ngIf="report() as cfg"
  [titleKey]="cfg.titleKey"
  [subtitleKey]="cfg.subtitleKey"
  [breadcrumbKey]="cfg.breadcrumbKey"
  [columns]="cfg.columns"
  [filterFields]="cfg.filters"
  [rows]="rows()"
  [loading]="loading()"
  [noDataText]="hasSearched() ? 'CAR_REPORTS.NO_DATA' : 'CAR_REPORTS.APPLY_FILTER_PROMPT'"
  [exportFileName]="cfg.exportFileName"
  [dataCaveatKey]="cfg.dataCaveatKey"
  [canExportExcel]="canExportExcel"
  [canExportPdf]="canExportPdf"
  [canPrint]="canPrint"
  (filtersChange)="onFiltersChange($event)"
  (refresh)="load()"
  (rowDblClick)="onRowDblClick($event)">
</app-car-report-shell>
