<mat-toolbar class="erp-list-toolbar report-toolbar">
  <button mat-stroked-button (click)="refresh.emit()">
    <mat-icon>refresh</mat-icon>
    {{ 'COMMON.REFRESH' | translate }}
  </button>

  <button mat-stroked-button (click)="columnChooser.emit()">
    <mat-icon>view_column</mat-icon>
    {{ 'COMMON.COLUMN_CHOOSER' | translate }}
  </button>

  <span class="erp-toolbar-spacer toolbar-spacer"></span>

  <span class="record-count">{{ 'COMMON.RECORD_COUNT' | translate }}: {{ recordCount }}</span>

  <button mat-icon-button [matMenuTriggerFor]="exportMenu" [matTooltip]="'COMMON.EXPORT' | translate">
    <mat-icon>file_download</mat-icon>
  </button>
  <mat-menu #exportMenu="matMenu">
    <button mat-menu-item [disabled]="!canExportExcel" (click)="exportExcel.emit()">
      <mat-icon>description</mat-icon>
      {{ 'COMMON.EXPORT_EXCEL' | translate }}
    </button>
    <button mat-menu-item [disabled]="!canExportPdf" (click)="exportPdf.emit()">
      <mat-icon>picture_as_pdf</mat-icon>
      {{ 'COMMON.EXPORT_PDF' | translate }}
    </button>
  </mat-menu>

  <button mat-icon-button [disabled]="!canPrint" (click)="print.emit()" [matTooltip]="'COMMON.PRINT' | translate">
    <mat-icon>print</mat-icon>
  </button>
</mat-toolbar>
