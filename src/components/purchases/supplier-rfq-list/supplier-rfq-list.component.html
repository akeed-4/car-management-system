<div class="erp-page container-fluid p-4">
  <div class="erp-page-header page-header strong-header header-row">
    <div class="erp-page-header-titles header-left">
      <h2 class="erp-page-title">{{ 'SUPPLIER_RFQ.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions header-right">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'SUPPLIER_RFQ.CREATE_TITLE' | translate }}
      </button>
    </div>
  </div>

  <!-- Shared DataGrid: single tag owns both the desktop grid and the <=768px card list. -->
  <div class="erp-grid-card">
    <app-shared-data-grid
      [dataSource]="quotations"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      [mobileItems]="quotations"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      keyExpr="id"
      [rtlEnabled]="true"
      height="600px"
      [showColumnChooser]="false"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      noDataText="SUPPLIER_RFQ.NO_QUOTATIONS"
      (rowAction)="onGridAction($event)">

      <!-- Mobile per-row action buttons (same as before). -->
      <ng-template let-q>
        <button type="button" class="btn btn-light" (click)="mobileEdit(q)">{{ 'COMMON.EDIT' | translate }}</button>
        @if (mobileCanSubmit(q)) {
          <button type="button" class="btn btn-light" (click)="mobileSubmit(q)">{{ 'SUPPLIER_RFQ.SUBMIT' | translate }}</button>
        }
        @if (mobileCanApproveReject(q)) {
          <button type="button" class="btn btn-light" (click)="mobileApprove(q)">{{ 'SUPPLIER_RFQ.APPROVE' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileReject(q)">{{ 'SUPPLIER_RFQ.REJECT' | translate }}</button>
        }
      </ng-template>

      <!-- Items-count column (was DevExtreme calculateCellValue; the Shared DataGrid's
           dxi-column doesn't wire that hook through, so ported as a display-only
           cellTemplate -- sorting/filtering on this column is disabled below). -->
      <ng-template #itemsCountTemplate let-cell>
        {{ getItemsCount(cell.data) }}
      </ng-template>

      <!-- Same status badge as before. -->
      <ng-template #statusCellTemplate let-cell>
        <span class="erp-status-badge status-badge" [ngClass]="{
          'warning': cell.value === 'Draft' || cell.value === 'Submitted',
          'success': cell.value === 'Approved',
          'danger': cell.value === 'Rejected'
        }">
          {{ ('SUPPLIER_RFQ.STATUS_' + cell.value?.toUpperCase()) | translate }}
        </span>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
