<div class="erp-page container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h2 class="erp-page-title">{{ 'PURCHASE_INVOICE.CREDIT_INVOICE_LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions">
      <a routerLink="/purchases/invoice/credit/new" class="btn btn-primary btn-small no-print" appHasPermission="purchases.credit.view">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        <span>{{ 'PURCHASE_INVOICE.NEW_CREDIT_INVOICE' | translate }}</span>
      </a>
    </div>
  </div>

  <div class="card invoice-card">
    <div class="table-controls">
       <div class="toggle-switch">
        <label for="showArchived">{{ 'PURCHASES.SHOW_ARCHIVED' | translate }}</label>
        <input type="checkbox" id="showArchived" [checked]="showArchived()" (change)="showArchived.set(!showArchived())">
      </div>
    </div>
    <div class="erp-grid-card table-wrapper premium-table">
      <!-- Shared DataGrid: same columns/status badge/print-edit-delete-archive-unarchive
           actions as before; on mobile it renders the same card list (mobileFields/mobileTitleOf/
           mobileTrackBy) in place of the clipped grid columns. -->
      <app-shared-data-grid
        [dataSource]="filteredAndSortedInvoices()"
        [columns]="columns"
        [rowActions]="rowActions"
        [cellTemplates]="cellTemplates"
        [mobileItems]="filteredAndSortedInvoices()"
        [mobileFields]="mobileFields"
        [mobileTitleOf]="mobileTitleOf"
        [mobileTrackBy]="mobileTrackBy"
        keyExpr="id"
        height="600px"
        [showSearchPanel]="false"
        selectionMode="single"
        [pageSize]="10"
        [allowedPageSizes]="[5, 10, 20]"
        (rowAction)="onGridAction($event)">

        <ng-template let-inv>
          <button type="button" class="btn btn-light" (click)="mobilePrint(inv)">{{ 'PURCHASES.PRINT_INVOICE' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileEdit(inv)">{{ 'PURCHASES.EDIT_INVOICE' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileDelete(inv)">{{ 'PURCHASES.DELETE_INVOICE' | translate }}</button>
          @if (mobileCanArchive(inv)) {
            <button type="button" class="btn btn-light" (click)="mobileArchive(inv)">{{ 'PURCHASES.ARCHIVE' | translate }}</button>
          }
          @if (mobileCanUnarchive(inv)) {
            <button type="button" class="btn btn-light" (click)="mobileUnarchive(inv)">{{ 'PURCHASES.UNARCHIVE' | translate }}</button>
          }
        </ng-template>

        <ng-template #supplierTemplate let-cell>
          {{ cell.data.supplier?.name || 'N/A' }}
        </ng-template>

        <ng-template #statusTemplate let-cell>
          <span class="erp-status-badge badge"
                [class.success]="cell.data.status === 'Paid'"
                [class.badge-green]="cell.data.status === 'Paid'"
                [class.danger]="cell.data.status === 'Unpaid'"
                [class.badge-red]="cell.data.status === 'Unpaid'">
            {{ cell.data.status }}
          </span>
        </ng-template>
      </app-shared-data-grid>
    </div>
  </div>
</div>
