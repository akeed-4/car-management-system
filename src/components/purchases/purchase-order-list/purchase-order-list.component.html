<div class="erp-page container-fluid p-4">
  <div class="erp-page-header page-header strong-header header-row">
    <div class="erp-page-header-titles header-left">
      <h2 class="erp-page-title">{{ 'PURCHASE_ORDER.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions header-right">
      <button mat-raised-button color="primary" (click)="onCreateNew()" appHasPermission="purchases.orders.view">
        <mat-icon>add</mat-icon>
        {{ 'PURCHASE_ORDER.CREATE_TITLE' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: same columns/status badge/edit action as before; on mobile it
         renders the same card list (mobileFields/mobileTitleOf/mobileTrackBy) in place of
         the clipped grid columns. -->
    <app-shared-data-grid
      [dataSource]="purchaseOrders"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      [mobileItems]="purchaseOrders"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      keyExpr="id"
      height="600px"
      noDataText="PURCHASE_ORDER.NO_ORDERS"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">

      <ng-template let-po>
        <button type="button" class="btn btn-light" (click)="mobileEdit(po)">{{ 'COMMON.EDIT' | translate }}</button>
      </ng-template>

      <ng-template #statusTemplate let-cell>
        <span class="erp-status-badge status-badge" [ngClass]="{
          'warning': cell.value === 'Open',
          'info': cell.value === 'PartiallyReceived',
          'success': cell.value === 'FullyReceived',
          'neutral': cell.value === 'Closed' || cell.value === 'Cancelled'
        }">
          {{ ('PURCHASE_ORDER.STATUS_' + cell.value?.toUpperCase()) | translate }}
        </span>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
