<div class="erp-page container mx-auto">
    <div class="erp-page-header page-header strong-header">
      <div class="erp-page-header-titles header-info">
        <h2 class="erp-page-title strong-title">{{ 'CASH_PURCHASE_RETURN.LIST_TITLE' | translate }}</h2>
      </div>
      <a routerLink="/purchases/return/cash/new" class="erp-page-actions btn btn-primary btn-small no-print" appHasPermission="purchases.returns.cash.view">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        </svg>
        <span> {{ 'CASH_PURCHASE_RETURN.NEW_RETURN' | translate }}
</span>
      </a>
    </div>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <div class="erp-grid-card datagrid-container">
      <!-- Shared DataGrid: same columns/print-edit-delete actions/total summary as before;
           on mobile it renders the same card list (mobileFields/mobileTitleOf/mobileTrackBy)
           in place of the grid. -->
      <app-shared-data-grid
        [dataSource]="filteredReturnInvoices()"
        [columns]="columns"
        [rowActions]="rowActions"
        [summaryItems]="summaryItems"
        [mobileItems]="filteredReturnInvoices()"
        [mobileFields]="mobileFields"
        [mobileTitleOf]="mobileTitleOf"
        [mobileTrackBy]="mobileTrackBy"
        keyExpr="id"
        height="600px"
        [showSearchPanel]="false"
        selectionMode="single"
        noDataText="PURCHASE_RETURN.NO_RETURNS"
        [pageSize]="10"
        [allowedPageSizes]="[5, 10, 20]"
        (rowAction)="onGridAction($event)">

        <ng-template let-inv>
          <button type="button" class="btn btn-light" (click)="mobilePrint(inv)">{{ 'PURCHASE_RETURN.PRINT' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileEdit(inv)">{{ 'PURCHASE_RETURN.EDIT' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileDelete(inv)">{{ 'PURCHASE_RETURN.DELETE' | translate }}</button>
        </ng-template>
      </app-shared-data-grid>
    </div>
  </div>
</div>
