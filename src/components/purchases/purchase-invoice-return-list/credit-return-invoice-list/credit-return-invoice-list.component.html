<div class="erp-page container mx-auto">
  <div class="erp-page-header page-header">
    <div class="erp-page-header-titles flex flex-col items-start gap-4">
      <h2 class="erp-page-title text-2xl font-semibold text-gray-800">{{ 'CREDIT_PURCHASE_RETURN.LIST_TITLE' | translate }}</h2>
      <a routerLink="/purchases/return/credit/new" class="btn-primary" appHasPermission="purchases.returns.credit.view">

        {{ 'CREDIT_PURCHASE_RETURN.NEW_RETURN' | translate }}

      </a>
    </div>
  </div>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <div class="erp-grid-card datagrid-container">
      <!-- Shared DataGrid: same columns/print-edit-delete actions/total summary as before. -->
      <app-shared-data-grid
        [dataSource]="filteredReturnInvoices()"
        [columns]="columns"
        [rowActions]="rowActions"
        [summaryItems]="summaryItems"
        keyExpr="id"
        height="600px"
        [showSearchPanel]="false"
        selectionMode="single"
        [pageSize]="10"
        [allowedPageSizes]="[5, 10, 20]"
        (rowAction)="onGridAction($event)">
      </app-shared-data-grid>
    </div>
  </div>
</div>
