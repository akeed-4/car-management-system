<div class="erp-page container-fluid p-4">
  <div class="erp-page-header page-header strong-header header-row">
    <div class="erp-page-header-titles header-left">
      <h2 class="erp-page-title">{{ 'CARS_RECEIPT_NOTE.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions header-right">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'CARS_RECEIPT_NOTE.CREATE_TITLE' | translate }}
      </button>
    </div>
  </div>

  @if (isMobile()) {
    <app-mobile-card-list
      [items]="receiptNotes"
      [fields]="mobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      emptyMessage="CARS_RECEIPT_NOTE.NO_RECEIPT_NOTES"
    >
      <ng-template let-note>
        <button type="button" class="btn btn-light" (click)="mobileView(note)">{{ 'COMMON.VIEW' | translate }}</button>
      </ng-template>
    </app-mobile-card-list>
  } @else {
  <div class="erp-grid-card">
  <dx-data-grid
    [dataSource]="receiptNotes"
    [showBorders]="true"
    [columnAutoWidth]="true"
    [rowAlternationEnabled]="true"
    [rtlEnabled]="true"
    height="600px"
    [showRowLines]="true"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    keyExpr="id">

    <dxo-search-panel [visible]="true"></dxo-search-panel>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

    <dxi-column dataField="grnNumber" [caption]="'CARS_RECEIPT_NOTE.GRN_NUMBER' | translate"></dxi-column>
    <dxi-column dataField="receiptDate" [caption]="'CARS_RECEIPT_NOTE.RECEIPT_DATE' | translate" dataType="date"></dxi-column>
    <dxi-column dataField="poNumber" [caption]="'CARS_RECEIPT_NOTE.PO_NUMBER' | translate"></dxi-column>
    <dxi-column dataField="items" [caption]="'CARS_RECEIPT_NOTE.ITEMS_COUNT' | translate" [calculateCellValue]="getItemsCount"></dxi-column>
    <dxi-column dataField="status" [caption]="'CARS_RECEIPT_NOTE.STATUS' | translate" cellTemplate="statusCellTemplate"></dxi-column>
    <div *dxTemplate="let cell of 'statusCellTemplate'">
      <app-document-status-badge [status]="cell.value"></app-document-status-badge>
    </div>

    <dxi-column type="buttons" [width]="90">
      <dxi-button
        icon="find"
        [hint]="'COMMON.VIEW' | translate"
        [onClick]="onView.bind(this)">
      </dxi-button>
    </dxi-column>
  </dx-data-grid>
  </div>
  }
</div>
