<div class="container-fluid p-4">
  <div class="page-header strong-header header-row">
    <div class="header-left">
      <h2>{{ 'PURCHASE_REQUISITION.LIST_TITLE' | translate }}</h2>
    </div>
    <div class="header-right">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'PURCHASE_REQUISITION.CREATE_TITLE' | translate }}
      </button>
    </div>
  </div>

  @if (isMobile()) {
    <app-mobile-card-list
      [items]="requisitions"
      [fields]="mobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      emptyMessage="PURCHASE_REQUISITION.NO_REQUISITIONS"
    >
      <ng-template let-req>
        <button type="button" class="btn btn-light" (click)="mobileView(req)">{{ 'COMMON.VIEW' | translate }}</button>
        <button type="button" class="btn btn-light" (click)="mobileEdit(req)">{{ 'COMMON.EDIT' | translate }}</button>
        <button type="button" class="btn btn-light" (click)="mobileSubmit(req)">{{ 'PURCHASE_REQUISITION.SUBMIT' | translate }}</button>
        @if (mobileCanApproveReject(req)) {
          <button type="button" class="btn btn-light" (click)="mobileApprove(req)">{{ 'PURCHASE_REQUISITION.APPROVE' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileReject(req)">{{ 'PURCHASE_REQUISITION.REJECT' | translate }}</button>
        }
      </ng-template>
    </app-mobile-card-list>
  } @else {
  <dx-data-grid
    [dataSource]="requisitions"
    [showBorders]="true"
    [columnAutoWidth]="true"
    [rowAlternationEnabled]="true"
    [rtlEnabled]="true"
    height="600px"
    [showRowLines]="true"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    keyExpr="id">

    <dxo-search-panel [visible]="true"></dxo-search-panel>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

    <dxi-column dataField="requisitionNumber" [caption]="'PURCHASE_REQUISITION.REQUISITION_NUMBER' | translate"></dxi-column>
    <dxi-column dataField="requisitionDate" [caption]="'PURCHASE_REQUISITION.REQUISITION_DATE' | translate" dataType="date"></dxi-column>
    <dxi-column dataField="departmentName" [caption]="'PURCHASE_REQUISITION.DEPARTMENT' | translate"></dxi-column>
    <dxi-column dataField="items" [caption]="'PURCHASE_REQUISITION.ITEMS_COUNT' | translate" [calculateCellValue]="getItemsCount"></dxi-column>
    <dxi-column dataField="status" [caption]="'PURCHASE_REQUISITION.STATUS' | translate" cellTemplate="statusCellTemplate"></dxi-column>
    <div *dxTemplate="let cell of 'statusCellTemplate'">
      <span class="status-badge" [ngClass]="{
        'status-draft': cell.value === 'Draft',
        'status-pending': cell.value === 'PendingApproval',
        'status-accepted': cell.value === 'Approved' || cell.value === 'PartiallyConverted' || cell.value === 'FullyConverted',
        'status-rejected': cell.value === 'Rejected'
      }">
        {{ ('PURCHASE_REQUISITION.STATUS_' + cell.value?.toUpperCase()) | translate }}
      </span>
    </div>

    <dxi-column type="buttons" [width]="200">
      <dxi-button
        icon="find"
        [hint]="'COMMON.VIEW' | translate"
        [onClick]="onView.bind(this)">
      </dxi-button>
      <dxi-button
        icon="edit"
        [hint]="'COMMON.EDIT' | translate"
        [onClick]="onEdit.bind(this)">
      </dxi-button>
      <dxi-button
        icon="upload"
        [hint]="'PURCHASE_REQUISITION.SUBMIT' | translate"
        [onClick]="onSubmit.bind(this)">
      </dxi-button>
      <dxi-button
        icon="check"
        [hint]="'PURCHASE_REQUISITION.APPROVE' | translate"
        [visible]="isPendingApproval"
        [onClick]="onApprove.bind(this)">
      </dxi-button>
      <dxi-button
        icon="close"
        [hint]="'PURCHASE_REQUISITION.REJECT' | translate"
        [visible]="isPendingApproval"
        [onClick]="onReject.bind(this)">
      </dxi-button>
    </dxi-column>
  </dx-data-grid>
  }
</div>
