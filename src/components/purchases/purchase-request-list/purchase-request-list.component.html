<div class="erp-page container-fluid p-4">
  <div class="erp-page-header page-header strong-header header-row">
    <div class="erp-page-header-titles header-left">
      <h2 class="erp-page-title">{{ 'PURCHASE_REQUESTS.TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions header-right">
      <button mat-raised-button color="primary" (click)="addNewRequest()" *appHasPermission="'purchases.requisitions.view'">
        <mat-icon>add</mat-icon>
        {{ 'PURCHASE_REQUESTS.CREATE_TITLE' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: same columns/status badge (with rejection-reason tooltip)/
         permission-gated actions as before; on mobile it renders the same card list
         (mobileFields/mobileTitleOf/mobileTrackBy) in place of the clipped grid columns. -->
    <app-shared-data-grid
      [dataSource]="purchaseRequests"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      [mobileItems]="purchaseRequests"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      keyExpr="id"
      height="600px"
      noDataText="PURCHASE_REQUESTS.NO_REQUESTS"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">

      <ng-template let-req>
        @if (mobileCanEdit(req)) {
          <button type="button" class="btn btn-light" (click)="mobileEdit(req)">{{ 'COMMON.EDIT' | translate }}</button>
        }
        @if (mobileCanApprove(req)) {
          <button type="button" class="btn btn-light" (click)="mobileApprove(req)">{{ 'PURCHASE_REQUESTS.APPROVE' | translate }}</button>
        }
        @if (mobileCanReject(req)) {
          <button type="button" class="btn btn-light" (click)="mobileReject(req)">{{ 'PURCHASE_REQUESTS.REJECT' | translate }}</button>
        }
        @if (mobileCanDelete(req)) {
          <button type="button" class="btn btn-light" (click)="mobileDelete(req)">{{ 'COMMON.DELETE' | translate }}</button>
        }
      </ng-template>

      <ng-template #statusTemplate let-cell>
        <span class="erp-status-badge status-badge"
          [ngClass]="{
            'warning': cell.value === 'Draft' || cell.value === 'Pending' || cell.value === 'PendingApproval',
            'success': cell.value === 'Approved',
            'danger': cell.value === 'Rejected'
          }"
          [matTooltip]="cell.value === 'Rejected' ? cell.data.rejectionReason : null"
          matTooltipPosition="above">
          {{ ('PURCHASE_REQUESTS.STATUS_' + cell.value?.toUpperCase()) | translate }}
        </span>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
