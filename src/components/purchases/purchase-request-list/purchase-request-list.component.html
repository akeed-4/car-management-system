<div class="container-fluid p-4">
  <div class="page-header strong-header header-row">
    <div class="header-left">
      <h2>{{ 'PURCHASE_REQUESTS.TITLE' | translate }}</h2>
    </div>
    <div class="header-right">
      <button mat-raised-button color="primary" (click)="addNewRequest()" *appHasPermission="'purchaseRequest.create'">
        <mat-icon>add</mat-icon>
        {{ 'PURCHASE_REQUESTS.CREATE_TITLE' | translate }}
      </button>
    </div>
  </div>

  <dx-data-grid
    [dataSource]="purchaseRequests"
    [showBorders]="true"
    [columnAutoWidth]="true"
    [rowAlternationEnabled]="true"
    [rtlEnabled]="true"
    height="600px"
    [showRowLines]="true"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    keyExpr="id">

    <dxo-search-panel [visible]="true"></dxo-search-panel>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

    <dxi-column dataField="requestNumber" [caption]="'PURCHASE_REQUESTS.REQUEST_NUMBER' | translate"></dxi-column>
    <dxi-column dataField="requestDate" [caption]="'PURCHASE_REQUESTS.REQUEST_DATE' | translate" dataType="date"></dxi-column>
    <dxi-column dataField="supplierName" [caption]="'PURCHASE_REQUESTS.SUPPLIER' | translate"></dxi-column>
    <dxi-column dataField="items" [caption]="'PURCHASE_REQUESTS.ITEMS_COUNT' | translate" [calculateCellValue]="getItemsCount"></dxi-column>
    <dxi-column dataField="totalAmount" [caption]="'PURCHASE_OFFERS.TOTAL_AMOUNT' | translate" format="currency"></dxi-column>
    <dxi-column dataField="status" [caption]="'PURCHASE_REQUESTS.STATUS' | translate" cellTemplate="statusCellTemplate"></dxi-column>
    <div *dxTemplate="let cell of 'statusCellTemplate'">
      <span class="status-badge" [ngClass]="{
        'status-pending': cell.value === 'Draft' || cell.value === 'Pending' || cell.value === 'PendingApproval',
        'status-accepted': cell.value === 'Approved',
        'status-rejected': cell.value === 'Rejected'
      }">
        {{ ('PURCHASE_REQUESTS.STATUS_' + cell.value?.toUpperCase()) | translate }}
      </span>
    </div>

    <dxi-column type="buttons" [width]="210">
      <dxi-button
        icon="edit"
        [hint]="'COMMON.EDIT' | translate"
        [visible]="canEdit"
        [onClick]="onEdit.bind(this)">
      </dxi-button>
      <dxi-button
        icon="check"
        [hint]="'PURCHASE_REQUESTS.APPROVE' | translate"
        [visible]="canApprove"
        [onClick]="onApprove.bind(this)">
      </dxi-button>
      <dxi-button
        icon="close"
        [hint]="'PURCHASE_REQUESTS.REJECT' | translate"
        [visible]="canReject"
        [onClick]="onReject.bind(this)">
      </dxi-button>
      <dxi-button
        icon="trash"
        [hint]="'COMMON.DELETE' | translate"
        [visible]="canDelete"
        [onClick]="onDelete.bind(this)">
      </dxi-button>
    </dxi-column>
  </dx-data-grid>
</div>
