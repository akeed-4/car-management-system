<div class="container-fluid p-4">
  <div class="page-header strong-header header-row">
    <div class="header-left">
      <h2>{{ 'PURCHASE_OFFERS.TITLE' | translate }}</h2>
    </div>
    <div class="header-right">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'PURCHASE_OFFER.CREATE_TITLE' | translate }}
      </button>
    </div>
  </div>

  @if (isMobile()) {
    <app-mobile-card-list
      [items]="purchaseOffers"
      [fields]="mobileFields"
      [titleOf]="mobileTitleOf"
      [trackByFn]="mobileTrackBy"
      emptyMessage="PURCHASE_OFFERS.NO_OFFERS"
    >
      <ng-template let-offer>
        <button type="button" class="btn btn-light" (click)="mobileEdit(offer)">{{ 'COMMON.EDIT' | translate }}</button>
        @if (mobileCanApproveReject(offer)) {
          <button type="button" class="btn btn-light" (click)="mobileApprove(offer)">{{ 'PURCHASE_OFFERS.APPROVE' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileReject(offer)">{{ 'PURCHASE_OFFERS.REJECT' | translate }}</button>
        }
      </ng-template>
    </app-mobile-card-list>
  } @else {
  <dx-data-grid
    [dataSource]="purchaseOffers"
   [showBorders]="true"
        [columnAutoWidth]="true"
        [rowAlternationEnabled]="true"
        [rtlEnabled]="true"
        height="600px"
        [showRowLines]="true"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        >

    <dxo-search-panel [visible]="true"></dxo-search-panel>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

    <dxi-column dataField="offerNumber" [caption]="'PURCHASE_OFFER.OFFER_NUMBER' | translate"></dxi-column>
    <dxi-column dataField="supplierName" [caption]="'PURCHASE_OFFER.SUPPLIER' | translate"></dxi-column>
    <dxi-column dataField="offerDate" [caption]="'PURCHASE_OFFER.OFFER_DATE' | translate" dataType="date"></dxi-column>
    <dxi-column dataField="items" [caption]="'PURCHASE_OFFERS.ITEMS_COUNT' | translate" [calculateCellValue]="getItemsCount"></dxi-column>
    <dxi-column dataField="totalAmount" [caption]="'PURCHASE_OFFERS.TOTAL_AMOUNT' | translate" format="currency"></dxi-column>
    <dxi-column dataField="status" [caption]="'PURCHASE_OFFER.STATUS' | translate" cellTemplate="statusCellTemplate"></dxi-column>
    <div *dxTemplate="let cell of 'statusCellTemplate'">
      <span class="status-badge" [ngClass]="{
        'status-pending': cell.value === 'Pending',
        'status-accepted': cell.value === 'Accepted',
        'status-rejected': cell.value === 'Rejected'
      }">
        {{ ('PURCHASE_OFFER.STATUS_' + cell.value?.toUpperCase()) | translate }}
      </span>
    </div>

    <dxi-column type="buttons" [width]="160">
      <dxi-button
        icon="edit"
        [hint]="'COMMON.EDIT' | translate"
        [onClick]="onEdit.bind(this)">
      </dxi-button>
      <dxi-button
        icon="check"
        [hint]="'PURCHASE_OFFERS.APPROVE' | translate"
        [visible]="isPending"
        [onClick]="onApprove.bind(this)">
      </dxi-button>
      <dxi-button
        icon="close"
        [hint]="'PURCHASE_OFFERS.REJECT' | translate"
        [visible]="isPending"
        [onClick]="onReject.bind(this)">
      </dxi-button>
    </dxi-column>
  </dx-data-grid>
  }
</div>
