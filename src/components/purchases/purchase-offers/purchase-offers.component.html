<div class="erp-page container-fluid p-4">
  <div class="erp-page-header page-header strong-header header-row">
    <div class="erp-page-header-titles header-left">
      <h2 class="erp-page-title">{{ 'PURCHASE_OFFERS.TITLE' | translate }}</h2>
    </div>
    <div class="erp-page-actions header-right">
      <button mat-raised-button color="primary" (click)="onCreateNew()">
        <mat-icon>add</mat-icon>
        {{ 'PURCHASE_OFFER.CREATE_TITLE' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: same columns/status badge/edit-approve-reject actions as before;
         on mobile it renders the same card list (mobileFields/mobileTitleOf/mobileTrackBy)
         in place of the clipped grid columns. -->
    <app-shared-data-grid
      [dataSource]="purchaseOffers"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      [mobileItems]="purchaseOffers"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      keyExpr="id"
      height="600px"
      noDataText="PURCHASE_OFFERS.NO_OFFERS"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">

      <ng-template let-offer>
        <button type="button" class="btn btn-light" (click)="mobileEdit(offer)">{{ 'COMMON.EDIT' | translate }}</button>
        @if (mobileCanApproveReject(offer)) {
          <button type="button" class="btn btn-light" (click)="mobileApprove(offer)">{{ 'PURCHASE_OFFERS.APPROVE' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileReject(offer)">{{ 'PURCHASE_OFFERS.REJECT' | translate }}</button>
        }
      </ng-template>

      <ng-template #statusTemplate let-cell>
        <span class="erp-status-badge status-badge" [ngClass]="{
          'warning': cell.value === 'Pending',
          'success': cell.value === 'Accepted',
          'danger': cell.value === 'Rejected'
        }">
          {{ ('PURCHASE_OFFER.STATUS_' + cell.value?.toUpperCase()) | translate }}
        </span>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
