<div class="erp-page container-fluid p-4">
  <div class="erp-page-header page-header strong-header header-row">
    <div class="erp-page-header-titles header-left">
      <h2 class="erp-page-title">{{ 'PURCHASE_REQUISITION.APPROVAL_LIST_TITLE' | translate }}</h2>
    </div>
  </div>

  <div class="erp-grid-card">
    <!-- Shared DataGrid: same columns/status badge/view-approve-reject actions as before;
         on mobile it renders the same card list (mobileFields/mobileTitleOf/mobileTrackBy)
         in place of the clipped grid columns. -->
    <app-shared-data-grid
      [dataSource]="requisitions"
      [columns]="columns"
      [rowActions]="rowActions"
      [cellTemplates]="cellTemplates"
      [mobileItems]="requisitions"
      [mobileFields]="mobileFields"
      [mobileTitleOf]="mobileTitleOf"
      [mobileTrackBy]="mobileTrackBy"
      keyExpr="id"
      height="600px"
      noDataText="PURCHASE_REQUISITION.NO_REQUISITIONS"
      [pageSize]="10"
      [allowedPageSizes]="[10, 20, 50]"
      (rowAction)="onGridAction($event)">

      <ng-template let-req>
        <button type="button" class="btn btn-light" (click)="mobileView(req)">{{ 'COMMON.VIEW' | translate }}</button>
        <button type="button" class="btn btn-light" (click)="mobileApprove(req)">{{ 'PURCHASE_REQUISITION.APPROVE' | translate }}</button>
        <button type="button" class="btn btn-light" (click)="mobileReject(req)">{{ 'PURCHASE_REQUISITION.REJECT' | translate }}</button>
      </ng-template>

      <ng-template #statusTemplate let-cell>
        <span class="erp-status-badge warning status-badge status-pending">
          {{ ('PURCHASE_REQUISITION.STATUS_' + cell.value?.toUpperCase()) | translate }}
        </span>
      </ng-template>
    </app-shared-data-grid>
  </div>
</div>
