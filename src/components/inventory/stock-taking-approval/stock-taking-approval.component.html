<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h1 class="erp-page-title">{{ 'STOCK_TAKING_APPROVAL.TITLE' | translate }}</h1>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="accent" routerLink="/inventory/stock-taking-approval/new">
        <mat-icon>add</mat-icon>
        {{ 'STOCK_TAKING_APPROVAL.CREATE_NEW' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-card">
    <div class="erp-grid-card">
      <!-- Shared DataGrid; the inert dxo-editing (allowUpdating/allowDeleting/allowAdding all
           false) is dropped -- SharedDataGrid has no inline editing, equivalent to disabled. -->
      <app-shared-data-grid
        [dataSource]="stockTakesApproval()"
        [columns]="columns"
        [rowActions]="rowActions"
        keyExpr="id"
        searchPlaceholder="البحث..."
        [pageSize]="10"
        [allowedPageSizes]="[5, 10, 20]"
        (rowAction)="onGridAction($event)">
      </app-shared-data-grid>
    </div>
  </div>
</div>
