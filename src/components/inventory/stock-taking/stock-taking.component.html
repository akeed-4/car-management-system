<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h1 class="erp-page-title">{{ 'INVENTORY.STOCK_TAKING.TITLE' | translate }}</h1>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="accent" routerLink="/inventory/stock-taking/new">
        <mat-icon>add</mat-icon>
        {{ 'INVENTORY.STOCK_TAKING.CREATE_NEW' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-card">
    <div class="erp-grid-card">
      <!-- Shared DataGrid: owns the desktop/mobile split internally (mobileItems/mobileFields
           reuse the same data + card config the old @if(isMobile()) branch used). The inert
           dxo-editing (allowUpdating/allowDeleting/allowAdding all false) is dropped --
           SharedDataGrid has no inline editing, which is equivalent to it being disabled. -->
      <app-shared-data-grid
        [dataSource]="stockTakes()"
        [columns]="columns"
        [rowActions]="rowActions"
        [mobileItems]="stockTakes()"
        [mobileFields]="mobileFields"
        [mobileTitleOf]="mobileTitleOf"
        [mobileTrackBy]="mobileTrackBy"
        keyExpr="id"
        height="600px"
        searchPlaceholder="البحث..."
        noDataText="COMMON.NO_DATA"
        [pageSize]="10"
        [allowedPageSizes]="[5, 10, 20]"
        (rowAction)="onGridAction($event)">
        <ng-template let-item>
          <button type="button" class="btn btn-light" (click)="mobileEdit(item)">{{ 'COMMON.EDIT' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileDelete(item)">{{ 'COMMON.DELETE' | translate }}</button>
        </ng-template>
      </app-shared-data-grid>
    </div>
  </div>
</div>

<app-modal
  [isOpen]="isDeleteModalOpen()"
  [title]="'INVENTORY.STOCK_TAKING.DELETE_CONFIRM_TITLE' | translate"
  [message]="'INVENTORY.STOCK_TAKING.DELETE_CONFIRM_MESSAGE' | translate"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()">
</app-modal>
