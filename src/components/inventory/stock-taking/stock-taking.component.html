<div class="erp-page">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h1 class="erp-page-title">{{ 'INVENTORY.STOCK_TAKING.TITLE' | translate }}</h1>
    </div>
    <div class="erp-page-actions">
      <button mat-raised-button color="accent" routerLink="/inventory/stock-taking/new">
        <mat-icon>add</mat-icon>
        {{ 'INVENTORY.STOCK_TAKING.CREATE_NEW' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-card">
    <!-- Mobile (<=768px): rows render as full-width cards instead of the grid's
         clipped/scrolling columns -- same data, same edit/delete actions. -->
    @if (isMobile()) {
      <app-mobile-card-list
        [items]="stockTakes()"
        [fields]="mobileFields"
        [titleOf]="mobileTitleOf"
        [trackByFn]="mobileTrackBy"
        emptyMessage="COMMON.NO_DATA"
      >
        <ng-template let-item>
          <button type="button" class="btn btn-light" (click)="mobileEdit(item)">{{ 'COMMON.EDIT' | translate }}</button>
          <button type="button" class="btn btn-light" (click)="mobileDelete(item)">{{ 'COMMON.DELETE' | translate }}</button>
        </ng-template>
      </app-mobile-card-list>
    } @else {
    <div class="erp-grid-card">
    <dx-data-grid
      [dataSource]="stockTakes()"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnAutoWidth]="true"
      height="600px"
      [wordWrapEnabled]="true"
      [rtlEnabled]="true">

      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]" [showInfo]="true"></dxo-pager>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-search-panel [visible]="true" [placeholder]="'البحث...'"></dxo-search-panel>
      <dxi-column dataField="id" visible="false" caption="{{ 'INVENTORY.STOCK_TAKING.DOCUMENT_NAME' | translate }}" ></dxi-column>

      <dxi-column dataField="documentName" caption="{{ 'INVENTORY.STOCK_TAKING.DOCUMENT_NAME' | translate }}" ></dxi-column>
      <dxi-column dataField="documentDate" caption="{{ 'INVENTORY.STOCK_TAKING.DATE' | translate }}" dataType="date" format="yyyy-MM-dd" ></dxi-column>
      <dxi-column dataField="createdBy" caption="{{ 'INVENTORY.STOCK_TAKING.CONDUCTED_BY' | translate }}" ></dxi-column>
      <dxi-column dataField="status" caption="{{ 'INVENTORY.STOCK_TAKING.STATUS' | translate }}" >
        <dxo-lookup [dataSource]="statusLookup"></dxo-lookup>
      </dxi-column>
      <dxi-column type="buttons" caption="{{ 'INVENTORY.STOCK_TAKING.ACTIONS' | translate }}" >
        <dxi-button  icon="edit"   [onClick]="onEditClick" ></dxi-button>
        <dxi-button  icon="trash"  [onClick]="onDeleteClick" ></dxi-button>
      </dxi-column>

      <dxo-editing mode="popup" [allowUpdating]="false" [allowDeleting]="false" [allowAdding]="false"></dxo-editing>

    </dx-data-grid>
    </div>
    }
  </div>
</div>

<app-modal
  [isOpen]="isDeleteModalOpen()"
  [title]="'INVENTORY.STOCK_TAKING.DELETE_CONFIRM_TITLE' | translate"
  [message]="'INVENTORY.STOCK_TAKING.DELETE_CONFIRM_MESSAGE' | translate"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()">
</app-modal>
