<div class="opening-balances-list-container">
  <div class="page-header">
    <div class="header-info">
      <h2 class="page-title">{{ 'ACCOUNTING.OPENING_BALANCES_INVENTORY' | translate }}</h2>
      <p class="page-subtitle">{{ 'ACCOUNTING.OPENING_BALANCES_INVENTORY_SUBTITLE' | translate }}</p>
    </div>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="onNew()" class="add-button">
        <mat-icon>add</mat-icon>
        <span>{{ 'ACCOUNTING.ADD_OPENING_BALANCE' | translate }}</span>
      </button>
    </div>
  </div>

  <mat-card class="data-grid-card">
    <mat-card-content>
      <div class="data-grid-container">
        <dx-data-grid
          [dataSource]="openingBalances"
          [showBorders]="true"
          [showRowLines]="true"
          [showColumnLines]="true"
          [allowColumnReordering]="true"
          [allowColumnResizing]="true"
          [columnAutoWidth]="true"
          [wordWrapEnabled]="true"
          [rtlEnabled]="true"
          [height]="500"
          [noDataText]="translate.instant('ACCOUNTING.NO_OPENING_BALANCES')"
          [showBorders]="true"
          [rowAlternationEnabled]="true"
          [filterRow]="{ visible: true }"
          [headerFilter]="{ visible: true }"
          [groupPanel]="{ visible: true }"
          [scrolling]="{ mode: 'standard' }"
          [paging]="{ pageSize: 20 }"
          [pager]="{
            showPageSizeSelector: true,
            allowedPageSizes: [10, 20, 50],
            showInfo: true,
            showNavigationButtons: true
          }"
          [searchPanel]="{ visible: true, placeholder: translate.instant('ACCOUNTING.SEARCH_OPENING_BALANCES') }"
          [editing]="{
            mode: 'cell',
            allowUpdating: true,
            allowDeleting: true,
            allowAdding: false
          }"
        >
          <dxi-column
            dataField="itemId"
            [caption]="translate.instant('ACCOUNTING.ITEM_ID')"
            dataType="number">
          </dxi-column>
          <dxi-column
            dataField="itemName"
            [caption]="translate.instant('ACCOUNTING.ACCOUNT_NAME')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="category"
            [caption]="translate.instant('ACCOUNTING.CATEGORY')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="quantity"
            [caption]="translate.instant('ACCOUNTING.QUANTITY')"
            dataType="number">
          </dxi-column>
          <dxi-column
            dataField="unitCost"
            [caption]="translate.instant('ACCOUNTING.UNIT_COST')"
            dataType="number"
            format="currency">
          </dxi-column>
          <dxi-column
            dataField="totalCost"
            [caption]="translate.instant('ACCOUNTING.TOTAL_COST')"
            dataType="number"
            format="currency"
            [allowEditing]="false">
          </dxi-column>
          <dxi-column
            dataField="location"
            [caption]="translate.instant('ACCOUNTING.LOCATION')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="notes"
            [caption]="translate.instant('ACCOUNTING.NOTES_EN')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="entryDate"
            [caption]="translate.instant('ACCOUNTING.ENTRY_DATE')"
            dataType="date"
            format="dd/MM/yyyy">
          </dxi-column>
          <dxi-column type="buttons">
            <dxi-button name="edit" [hint]="translate.instant('ACCOUNTING.EDIT')" icon="edit" (onClick)="onEdit"></dxi-button>
            <dxi-button name="delete" [hint]="translate.instant('ACCOUNTING.DELETE')" icon="trash" (onClick)="onDelete"></dxi-button>
          </dxi-column>

          <dxo-filter-row [visible]="true"></dxo-filter-row>
          <dxo-header-filter [visible]="true"></dxo-header-filter>
          <dxo-grouping [autoExpandAll]="false" [contextMenuEnabled]="true"></dxo-grouping>
          <dxo-scrolling mode="standard" columnRenderingMode="standard" rowRenderingMode="standard" [useNative]="false"
            [scrollByContent]="true" [scrollByThumb]="true"></dxo-scrolling>
          <dxo-editing
            mode="cell"
            [allowUpdating]="true"
            [allowDeleting]="true"
            [allowAdding]="false">
          </dxo-editing>
        </dx-data-grid>
      </div>
    </mat-card-content>
  </mat-card>
</div>
