<div class="erp-page opening-balances-list-container">
  <div class="erp-page-header page-header">
    <div class="erp-page-header-titles header-info">
      <h2 class="erp-page-title page-title">{{ 'ACCOUNTING.OPENING_BALANCES_INVENTORY' | translate }}</h2>
      <p class="erp-page-subtitle page-subtitle">{{ 'ACCOUNTING.OPENING_BALANCES_INVENTORY_SUBTITLE' | translate }}</p>
    </div>
    <div class="erp-page-actions header-actions">
      <button mat-raised-button color="primary" (click)="onNew()" class="add-button">
        <mat-icon>add</mat-icon>
        <span>{{ 'ACCOUNTING.ADD_OPENING_BALANCE' | translate }}</span>
      </button>
    </div>
  </div>

  <div class="erp-card data-grid-card">
      <!-- Mobile (<=768px): the 9-column grid doesn't fit a phone width, so rows render as
           full-width cards instead -- same data, same edit/delete actions. -->
      @if (isMobile()) {
        <app-mobile-card-list
          [items]="openingBalances()"
          [fields]="mobileFields"
          [titleOf]="mobileTitleOf"
          [trackByFn]="mobileTrackBy"
          emptyMessage="ACCOUNTING.NO_OPENING_BALANCES"
        >
          <ng-template let-item>
            <button type="button" class="btn btn-light" (click)="mobileEdit(item)">{{ 'ACCOUNTING.EDIT' | translate }}</button>
            <button type="button" class="btn btn-light" (click)="mobileDelete(item)">{{ 'ACCOUNTING.DELETE' | translate }}</button>
          </ng-template>
        </app-mobile-card-list>
      } @else {
      <div class="erp-grid-card data-grid-container">
        <dx-data-grid
          [dataSource]="openingBalances()"
          [showBorders]="true"
          [showRowLines]="true"
          [showColumnLines]="true"
          [allowColumnReordering]="true"
          [allowColumnResizing]="true"
          [columnAutoWidth]="true"
          [wordWrapEnabled]="true"
          [rtlEnabled]="true"
          [height]="500"
          [noDataText]="translate.instant('ACCOUNTING.NO_OPENING_BALANCES')"
          [showBorders]="true"
          [rowAlternationEnabled]="true"
          [filterRow]="{ visible: true }"
          [headerFilter]="{ visible: true }"
          [groupPanel]="{ visible: true }"
          [scrolling]="{ mode: 'standard' }"
          [paging]="{ pageSize: 20 }"
          [pager]="{
            showPageSizeSelector: true,
            allowedPageSizes: [10, 20, 50],
            showInfo: true,
            showNavigationButtons: true
          }"
          [searchPanel]="{ visible: true, placeholder: translate.instant('ACCOUNTING.SEARCH_OPENING_BALANCES') }"
          [editing]="{
            mode: 'cell',
            allowUpdating: true,
            allowDeleting: true,
            allowAdding: false
          }"
        >
          <dxi-column
            dataField="itemId"
            [caption]="translate.instant('ACCOUNTING.ITEM_ID')"
            dataType="number">
          </dxi-column>
          <dxi-column
            dataField="itemName"
            [caption]="translate.instant('ACCOUNTING.ACCOUNT_NAME')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="category"
            [caption]="translate.instant('ACCOUNTING.CATEGORY')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="quantity"
            [caption]="translate.instant('ACCOUNTING.QUANTITY')"
            dataType="number">
          </dxi-column>
          <dxi-column
            dataField="unitCost"
            [caption]="translate.instant('ACCOUNTING.UNIT_COST')"
            dataType="number"
            format="currency">
          </dxi-column>
          <dxi-column
            dataField="totalCost"
            [caption]="translate.instant('ACCOUNTING.TOTAL_COST')"
            dataType="number"
            format="currency"
            [allowEditing]="false">
          </dxi-column>
          <dxi-column
            dataField="location"
            [caption]="translate.instant('ACCOUNTING.LOCATION')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="notes"
            [caption]="translate.instant('ACCOUNTING.NOTES_EN')"
            dataType="string">
          </dxi-column>
          <dxi-column
            dataField="entryDate"
            [caption]="translate.instant('ACCOUNTING.ENTRY_DATE')"
            dataType="date"
            format="dd/MM/yyyy">
          </dxi-column>
          <dxi-column type="buttons">
            <dxi-button  [hint]="translate.instant('ACCOUNTING.EDIT')" icon="edit" [onClick]="onEditClick"></dxi-button>
            <dxi-button [hint]="translate.instant('ACCOUNTING.DELETE')" icon="trash" [onClick]="onDeleteClick"></dxi-button>
          </dxi-column>

          <dxo-filter-row [visible]="true"></dxo-filter-row>
          <dxo-header-filter [visible]="true"></dxo-header-filter>
          <dxo-grouping [autoExpandAll]="false" [contextMenuEnabled]="true"></dxo-grouping>
          <dxo-scrolling mode="standard" columnRenderingMode="standard" rowRenderingMode="standard" [useNative]="false"
            [scrollByContent]="true" [scrollByThumb]="true"></dxo-scrolling>
          <dxo-editing
            mode="cell"
            [allowUpdating]="true"
            [allowDeleting]="true"
            [allowAdding]="false">
          </dxo-editing>
        </dx-data-grid>
      </div>
      }
  </div>
</div>
