

<div class="erp-page page-container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h1 class="erp-page-title">{{ 'INVENTORY.TITLE' | translate }}</h1>
    </div>
    <div class="erp-page-actions">
      <button mat-icon-button (click)="isScannerOpen.set(true)" matTooltip="{{ 'INVENTORY.SCAN_VIN' | translate }}">
        <mat-icon>qr_code_scanner</mat-icon>
      </button>
      <button mat-raised-button color="accent" routerLink="/inventory/new">
        <mat-icon>add</mat-icon>
        {{ 'INVENTORY.ADD_NEW_CAR' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-card">
    <div class="erp-list-toolbar filters-section">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>{{ 'INVENTORY.CONDITION_FILTER' | translate }}</mat-label>
        <mat-select [value]="conditionFilter()" (valueChange)="setConditionFilter($event)">
          <mat-option value="All">{{ 'INVENTORY.ALL' | translate }}</mat-option>
          <mat-option value="New">{{ 'INVENTORY.NEW_CARS' | translate }}</mat-option>
          <mat-option value="Used">{{ 'INVENTORY.USED_CARS' | translate }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-slide-toggle
        [checked]="showArchived()"
        (change)="showArchived.set($event.checked)"
        color="primary">
        {{ 'INVENTORY.SHOW_ARCHIVED' | translate }}
      </mat-slide-toggle>
    </div>

    <!-- Mobile (<=768px): rows render as full-width cards instead of the grid's
         clipped/scrolling columns -- same data, same edit/delete/archive/deposit
         actions with the same visibility guards as the desktop grid buttons. -->
    @if (isMobile()) {
      <app-mobile-card-list
        [items]="filteredAndSortedCars()"
        [fields]="mobileFields"
        [titleOf]="mobileTitleOf"
        [trackByFn]="mobileTrackBy"
        emptyMessage="COMMON.NO_DATA"
      >
        <ng-template let-item>
          <button *ngIf="mobileIsEditVisible(item)" type="button" class="btn btn-light" (click)="mobileEdit(item)">{{ 'INVENTORY.EDIT' | translate }}</button>
          <button *ngIf="mobileIsDeleteVisible(item)" type="button" class="btn btn-light" (click)="mobileDelete(item)">{{ 'INVENTORY.DELETE' | translate }}</button>
          <button *ngIf="mobileIsArchiveVisible(item)" type="button" class="btn btn-light" (click)="mobileArchive(item)">{{ 'INVENTORY.ARCHIVE' | translate }}</button>
          <button *ngIf="mobileIsUnarchiveVisible(item)" type="button" class="btn btn-light" (click)="mobileUnarchive(item)">{{ 'INVENTORY.UNARCHIVE' | translate }}</button>
          <button *ngIf="mobileIsDepositVisible(item)" type="button" class="btn btn-light" (click)="mobileDeposit(item)">{{ 'INVENTORY.DEPOSIT_VOUCHER' | translate }}</button>
        </ng-template>
      </app-mobile-card-list>
    } @else {
    <div class="erp-grid-card">
    <dx-data-grid
      [dataSource]="filteredAndSortedCars()"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [rowAlternationEnabled]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="true"
      [rtlEnabled]="true"
      (onRowUpdated)="onRowUpdated($event)">

      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]" [showInfo]="true"></dxo-pager>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-search-panel [visible]="true" [placeholder]="'البحث...'"></dxo-search-panel>

      <dxi-column dataField="make" caption="{{ 'INVENTORY.CAR' | translate }}" [calculateDisplayValue]="getCarDisplayValue" ></dxi-column>

      <dxi-column dataField="vin" caption="{{ 'INVENTORY.VIN' | translate }}" ></dxi-column>

      <dxi-column dataField="salePrice" caption="{{ 'INVENTORY.SALE_PRICE' | translate }}" dataType="number" format="'$#,##0'" ></dxi-column>

      <dxi-column dataField="status" caption="{{ 'INVENTORY.STATUS' | translate }}" [calculateDisplayValue]="getStatusDisplayValue" >
        <dxo-lookup [dataSource]="statusOptions"></dxo-lookup>
      </dxi-column>

      <dxi-column dataField="currentLocation" caption="{{ 'INVENTORY.CURRENT_LOCATION' | translate }}" [width]="150" [allowEditing]="!showArchived()"></dxi-column>

      <dxi-column type="buttons" caption="{{ 'INVENTORY.ACTIONS' | translate }}" [width]="200">
        <dxi-button name="edit" [onClick]="onEditClick" [visible]="isEditVisible" icon="edit" hint="{{ 'INVENTORY.EDIT' | translate }}"></dxi-button>
        <dxi-button name="delete" [onClick]="onDeleteClick" [visible]="isDeleteVisible" icon="trash" hint="{{ 'INVENTORY.DELETE' | translate }}"></dxi-button>
        <dxi-button name="archive" [onClick]="onArchiveClick" [visible]="isArchiveVisible" icon="archive" hint="{{ 'INVENTORY.ARCHIVE' | translate }}"></dxi-button>
        <dxi-button name="unarchive" [onClick]="onUnarchiveClick" [visible]="isUnarchiveVisible" icon="unarchive" hint="{{ 'INVENTORY.UNARCHIVE' | translate }}"></dxi-button>
        <dxi-button name="deposit" [onClick]="onDepositClick" [visible]="isDepositVisible" icon="money" hint="{{ 'INVENTORY.DEPOSIT_VOUCHER' | translate }}"></dxi-button>
      </dxi-column>

      <dxo-editing mode="cell" [allowUpdating]="!showArchived()" [allowDeleting]="false" [allowAdding]="false"></dxo-editing>

    </dx-data-grid>
    </div>
    }
  </div>
</div>

<app-modal
  [isOpen]="isDeleteModalOpen()"
  [title]="'INVENTORY.DELETE_CONFIRM_TITLE' | translate"
  [message]="'INVENTORY.DELETE_CONFIRM_MESSAGE' | translate"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()">
</app-modal>

<app-vin-scanner
  [isOpen]="isScannerOpen()"
  (vinScanned)="onVinScanned($event)"
  (cancel)="isScannerOpen.set(false)">
</app-vin-scanner>
