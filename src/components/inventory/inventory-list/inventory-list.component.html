

<div class="erp-page page-container">
  <div class="erp-page-header">
    <div class="erp-page-header-titles">
      <h1 class="erp-page-title">{{ 'INVENTORY.TITLE' | translate }}</h1>
    </div>
    <div class="erp-page-actions">
      <button mat-icon-button (click)="isScannerOpen.set(true)" matTooltip="{{ 'INVENTORY.SCAN_VIN' | translate }}">
        <mat-icon>qr_code_scanner</mat-icon>
      </button>
      <button mat-raised-button color="accent" routerLink="/inventory/new">
        <mat-icon>add</mat-icon>
        {{ 'INVENTORY.ADD_NEW_CAR' | translate }}
      </button>
    </div>
  </div>

  <div class="erp-card">
    <!-- Mobile (<=768px): rows render as full-width cards instead of the grid's
         clipped/scrolling columns -- same data, same edit/delete/archive/deposit
         actions with the same visibility guards as the desktop grid buttons. -->
    @if (isMobile()) {
      <div class="erp-list-toolbar filters-section">
        <mat-slide-toggle
          [checked]="showArchived()"
          (change)="showArchived.set($event.checked)"
          color="primary">
          {{ 'INVENTORY.SHOW_ARCHIVED' | translate }}
        </mat-slide-toggle>
      </div>
      <app-mobile-card-list
        [items]="mobileFilteredCars()"
        [fields]="mobileFields"
        [titleOf]="mobileTitleOf"
        [trackByFn]="mobileTrackBy"
        emptyMessage="COMMON.NO_DATA"
      >
        <ng-template let-item>
          <button *ngIf="mobileIsEditVisible(item)" type="button" class="btn btn-light" (click)="mobileEdit(item)">{{ 'INVENTORY.EDIT' | translate }}</button>
          <button *ngIf="mobileIsDeleteVisible(item)" type="button" class="btn btn-light" (click)="mobileDelete(item)">{{ 'INVENTORY.DELETE' | translate }}</button>
          <button *ngIf="mobileIsArchiveVisible(item)" type="button" class="btn btn-light" (click)="mobileArchive(item)">{{ 'INVENTORY.ARCHIVE' | translate }}</button>
          <button *ngIf="mobileIsUnarchiveVisible(item)" type="button" class="btn btn-light" (click)="mobileUnarchive(item)">{{ 'INVENTORY.UNARCHIVE' | translate }}</button>
          <button *ngIf="mobileIsDepositVisible(item)" type="button" class="btn btn-light" (click)="mobileDeposit(item)">{{ 'INVENTORY.DEPOSIT_VOUCHER' | translate }}</button>
        </ng-template>
      </app-mobile-card-list>
    } @else {
    <div class="erp-grid-card">
      <app-shared-data-grid
        [dataSource]="carsGridStore"
        [columns]="columns"
        [rowActions]="rowActions"
        [dxRemoteOperations]="true"
        keyExpr="id"
        [rtlEnabled]="true"
        [height]="600"
        searchPlaceholder="COMMON.SEARCH"
        noDataText="COMMON.NO_DATA"
        [pageSize]="20"
        [allowedPageSizes]="[10, 20, 50]"
        (rowAction)="onGridAction($event)">
      </app-shared-data-grid>
    </div>
    }
  </div>
</div>

<app-modal
  [isOpen]="isDeleteModalOpen()"
  [title]="'INVENTORY.DELETE_CONFIRM_TITLE' | translate"
  [message]="'INVENTORY.DELETE_CONFIRM_MESSAGE' | translate"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()">
</app-modal>

<app-vin-scanner
  [isOpen]="isScannerOpen()"
  (vinScanned)="onVinScanned($event)"
  (cancel)="isScannerOpen.set(false)">
</app-vin-scanner>
