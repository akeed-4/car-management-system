<mat-card>
  <mat-toolbar color="primary">
    <span>{{ 'CONSIGNMENT.LIST_TITLE' | translate }}</span>
    <span class="spacer"></span>
    <button mat-raised-button color="accent" routerLink="/consignment-cars/new">
      <mat-icon>add</mat-icon>
      {{ 'CONSIGNMENT.ADD_NEW' | translate }}
    </button>
  </mat-toolbar>

  <mat-card-content>
    <div class="controls">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'CONSIGNMENT.SHOW_ARCHIVED' | translate }}</mat-label>
        <mat-slide-toggle [(ngModel)]="showArchived"></mat-slide-toggle>
      </mat-form-field>
    </div>

    <dx-data-grid
      [dataSource]="filteredCars()"
      [showBorders]="true"
      [showRowLines]="true"
      [showColumnLines]="true"
      [rtlEnabled]="true"
      [allowColumnReordering]="true"
      [allowColumnResizing]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="true">

      <dxo-search-panel [visible]="true" placeholder="{{ 'CONSIGNMENT.SEARCH_PLACEHOLDER' | translate }}"></dxo-search-panel>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]" [showInfo]="true"></dxo-pager>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>

      <dxi-column dataField="make" caption="{{ 'CONSIGNMENT.COLUMNS.CAR' | translate }}" [calculateDisplayValue]="getCarDisplayValue"></dxi-column>
      <dxi-column dataField="ownerName" caption="{{ 'CONSIGNMENT.COLUMNS.OWNER' | translate }}" [calculateDisplayValue]="getOwnerDisplayValue"></dxi-column>
      <dxi-column dataField="agreedSalePrice" caption="{{ 'CONSIGNMENT.COLUMNS.AGREED_SALE_PRICE' | translate }}" dataType="number" format="'$#,##0'"></dxi-column>
      <dxi-column dataField="commissionRate" caption="{{ 'CONSIGNMENT.COLUMNS.COMMISSION_RATE' | translate }}" dataType="number" format="'#,##0.00%'"></dxi-column>
      <dxi-column dataField="status" caption="{{ 'CONSIGNMENT.COLUMNS.STATUS' | translate }}" [calculateDisplayValue]="getStatusDisplayValue">
        <dxo-lookup [dataSource]="statusOptions"></dxo-lookup>
      </dxi-column>
      <dxi-column type="buttons" caption="{{ 'CONSIGNMENT.COLUMNS.ACTIONS' | translate }}" [width]="200">
        <dxi-button
          text="{{ 'CONSIGNMENT.ACTIONS.SELL' | translate }}"
          [onClick]="requestSell"
          icon="check"
          hint="{{ 'CONSIGNMENT.ACTIONS.SELL' | translate }}"
          [visible]="getSellButtonVisible">
        </dxi-button>
        <dxi-button
          text="{{ 'CONSIGNMENT.ACTIONS.EDIT' | translate }}"
          [onClick]="editCar"
          icon="edit"
          hint="{{ 'CONSIGNMENT.ACTIONS.EDIT' | translate }}"
          [visible]="getEditButtonVisible">
        </dxi-button>
        <dxi-button
          text="{{ 'CONSIGNMENT.ACTIONS.DELETE' | translate }}"
          [onClick]="requestDelete"
          icon="trash"
          hint="{{ 'CONSIGNMENT.ACTIONS.DELETE' | translate }}"
          [visible]="getDeleteButtonVisible">
        </dxi-button>
        <dxi-button
          text="{{ 'CONSIGNMENT.ACTIONS.ARCHIVE' | translate }}"
          [onClick]="archiveCar"
          icon="archive"
          hint="{{ 'CONSIGNMENT.ACTIONS.ARCHIVE' | translate }}"
          [visible]="getArchiveButtonVisible">
        </dxi-button>
        <dxi-button
          text="{{ 'CONSIGNMENT.ACTIONS.UNARCHIVE' | translate }}"
          [onClick]="unarchiveCar"
          icon="unarchive"
          hint="{{ 'CONSIGNMENT.ACTIONS.UNARCHIVE' | translate }}"
          [visible]="getUnarchiveButtonVisible">
        </dxi-button>
      </dxi-column>
    </dx-data-grid>
  </mat-card-content>
</mat-card>

<app-modal 
  [isOpen]="isSellModalOpen()" 
  title="{{ 'CONSIGNMENT.SELL_MODAL_TITLE' | translate }}"
  message="{{ 'CONSIGNMENT.SELL_MODAL_MESSAGE' | translate }}"
  (confirm)="confirmSell()"
  (cancel)="closeSellModal()">
  <div modal-body-content>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'CONSIGNMENT.SELL_MODAL_PRICE_LABEL' | translate }}</mat-label>
      <input matInput type="number" [(ngModel)]="salePriceInput" required min="0">
    </mat-form-field>
  </div>
</app-modal>

<app-modal 
  [isOpen]="isDeleteModalOpen()" 
  title="{{ 'CONSIGNMENT.DELETE_MODAL_TITLE' | translate }}" 
  message="{{ 'CONSIGNMENT.DELETE_MODAL_MESSAGE' | translate }}"
  (confirm)="confirmDelete()" 
  (cancel)="closeDeleteModal()">
</app-modal>
